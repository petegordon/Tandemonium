<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; connect-src https://tandemonium-api.pete-872.workers.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'">
<title>Tandemonium Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 1.6em; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 0.85em; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .controls select, .controls button { background: #1a1d27; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; font-size: 0.85em; cursor: pointer; }
  .controls button { background: #2563eb; border-color: #2563eb; }
  .controls button:hover { background: #1d4ed8; }
  .controls button:disabled { opacity: 0.5; cursor: wait; }
  .status { font-size: 0.8em; color: #666; margin-left: auto; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { background: #1a1d27; border-radius: 10px; padding: 16px; text-align: center; }
  .kpi .value { font-size: 2em; font-weight: 700; color: #fff; }
  .kpi .label { font-size: 0.75em; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .sub { font-size: 0.8em; color: #666; margin-top: 2px; }

  /* Sections */
  .section { margin-bottom: 28px; }
  .section h2 { font-size: 1.1em; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .card { background: #1a1d27; border-radius: 10px; padding: 16px; }
  .card h3 { font-size: 0.9em; color: #aaa; margin-bottom: 10px; }
  .card canvas { max-height: 260px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
  th { text-align: left; color: #888; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #333; }
  td { padding: 6px 8px; border-bottom: 1px solid #1e2030; }
  tr:hover td { background: #1e2030; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pct { color: #60a5fa; }
  .warn { color: #fbbf24; }
  .good { color: #34d399; }
  .bad { color: #f87171; }

  .empty { color: #555; font-style: italic; padding: 20px; text-align: center; }
  .loading { text-align: center; padding: 40px; color: #555; }
</style>
</head>
<body>

<h1>Tandemonium Analytics</h1>
<div class="subtitle">Steam Next Fest Dashboard</div>

<!-- Auth gate: shown when not signed in -->
<div id="auth-gate" style="text-align:center;padding:60px 20px;">
  <p style="color:#888;margin-bottom:20px;">Sign in with an authorized Google account to view the dashboard.</p>
  <div id="g_id_onload"
       data-client_id="640682648249-dp1dou0mmpkm6m697oakbe9odabt1dui.apps.googleusercontent.com"
       data-callback="onGoogleSignIn"
       data-auto_select="true">
  </div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with"></div>
</div>

<!-- Dashboard controls: shown when signed in -->
<div id="dashboard-ui" style="display:none;">
  <div class="controls">
    <select id="days">
      <option value="1">Last 24 hours</option>
      <option value="7" selected>Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <button id="refresh">Refresh</button>
    <label style="font-size:0.82em;"><input type="checkbox" id="auto-refresh"> Auto-refresh 60s</label>
    <label style="font-size:0.82em;"><input type="checkbox" id="exclude-dev"> Exclude developer</label>
    <button id="exclude-edit-btn" style="background:#333;border-color:#555;font-size:0.78em;">Edit exclusions</button>
    <span class="status" id="status">Loading...</span>
    <button id="sign-out" style="background:#333;border-color:#555;margin-left:8px;">Sign out</button>
  </div>

  <!-- Exclusion editor panel -->
  <div id="exclude-panel" style="display:none;background:#1a1d27;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:16px;">
    <h3 style="font-size:0.9em;color:#aaa;margin-bottom:10px;">Developer Session Exclusions</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <label style="font-size:0.8em;color:#888;">Excluded IPs (one per line; a trailing * matches a prefix, e.g. an IPv6 /64; # starts a note)</label>
        <textarea id="exclude-ips" rows="6" style="width:100%;background:#0f1117;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:8px;font-size:0.82em;font-family:monospace;margin-top:4px;resize:vertical;"></textarea>
        <button id="exclude-detect" style="background:#333;border-color:#555;font-size:0.75em;margin-top:4px;">Auto-detect my IPs</button>
        <span id="exclude-detect-status" style="font-size:0.75em;color:#888;margin-left:6px;"></span>
      </div>
      <div>
        <label style="font-size:0.8em;color:#888;">Excluded accounts (one per line: account number, or steam:… / discord:… / google:… sign-in id; # starts a note)</label>
        <textarea id="exclude-uids" rows="6" style="width:100%;background:#0f1117;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:8px;font-size:0.82em;font-family:monospace;margin-top:4px;resize:vertical;"></textarea>
      </div>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px;">
      <button id="exclude-save" style="font-size:0.82em;">Save & Refresh</button>
      <button id="exclude-cancel" style="background:#333;border-color:#555;font-size:0.82em;">Cancel</button>
    </div>
  </div>
  <div id="content"><div class="loading">Loading dashboard...</div></div>
</div>

<script src="/dashboard/dashboard.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
