<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandemonium Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 1.6em; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 0.85em; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .controls select, .controls button { background: #1a1d27; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; font-size: 0.85em; cursor: pointer; }
  .controls button { background: #2563eb; border-color: #2563eb; }
  .controls button:hover { background: #1d4ed8; }
  .controls button:disabled { opacity: 0.5; cursor: wait; }
  .status { font-size: 0.8em; color: #666; margin-left: auto; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { background: #1a1d27; border-radius: 10px; padding: 16px; text-align: center; }
  .kpi .value { font-size: 2em; font-weight: 700; color: #fff; }
  .kpi .label { font-size: 0.75em; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .sub { font-size: 0.8em; color: #666; margin-top: 2px; }

  /* Sections */
  .section { margin-bottom: 28px; }
  .section h2 { font-size: 1.1em; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .card { background: #1a1d27; border-radius: 10px; padding: 16px; }
  .card h3 { font-size: 0.9em; color: #aaa; margin-bottom: 10px; }
  .card canvas { max-height: 260px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
  th { text-align: left; color: #888; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #333; }
  td { padding: 6px 8px; border-bottom: 1px solid #1e2030; }
  tr:hover td { background: #1e2030; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pct { color: #60a5fa; }
  .warn { color: #fbbf24; }
  .good { color: #34d399; }
  .bad { color: #f87171; }

  .empty { color: #555; font-style: italic; padding: 20px; text-align: center; }
  .loading { text-align: center; padding: 40px; color: #555; }
</style>
</head>
<body>

<h1>Tandemonium Analytics</h1>
<div class="subtitle">Steam Next Fest Dashboard</div>

<div class="controls">
  <select id="days">
    <option value="1">Last 24 hours</option>
    <option value="7" selected>Last 7 days</option>
    <option value="14">Last 14 days</option>
    <option value="30">Last 30 days</option>
    <option value="90">Last 90 days</option>
  </select>
  <button id="refresh" onclick="loadAll()">Refresh</button>
  <label style="font-size:0.82em;"><input type="checkbox" id="auto-refresh"> Auto-refresh 60s</label>
  <span class="status" id="status">Loading...</span>
</div>

<div id="content"><div class="loading">Loading dashboard...</div></div>

<script>
const API = 'https://tandemonium-api.pete-872.workers.dev/api/analytics/dashboard';
let charts = {};
let autoTimer = null;

function getDays() { return document.getElementById('days').value; }

async function fetchJSON(route) {
  const r = await fetch(`${API}/${route}?days=${getDays()}`);
  if (!r.ok) throw new Error(`${route}: ${r.status}`);
  return r.json();
}

function pct(n, d) { return d > 0 ? Math.round(n * 1000 / d) / 10 : 0; }
function fmt(n) { return n != null ? Number(n).toLocaleString() : '0'; }

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

const COLORS = {
  blue: '#3b82f6', green: '#34d399', yellow: '#fbbf24', red: '#f87171',
  purple: '#a78bfa', cyan: '#22d3ee', orange: '#fb923c', pink: '#f472b6',
  blueFill: 'rgba(59,130,246,0.15)', greenFill: 'rgba(52,211,153,0.15)',
};

function makeChart(id, type, labels, datasets, opts = {}) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { color: '#888', boxWidth: 12 } } },
      scales: type === 'doughnut' || type === 'pie' ? {} : {
        x: { ticks: { color: '#666', maxRotation: 45 }, grid: { color: '#1e2030' } },
        y: { ticks: { color: '#666' }, grid: { color: '#1e2030' }, beginAtZero: true, ...opts.y },
      },
      ...opts,
    }
  });
}

async function loadAll() {
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Loading...';
  destroyCharts();

  try {
    const [overview, daily, funnel, rides, crashes, conversions, network, devices, dda] = await Promise.all([
      fetchJSON('overview'), fetchJSON('daily'), fetchJSON('funnel'),
      fetchJSON('rides'), fetchJSON('crashes'), fetchJSON('conversions'),
      fetchJSON('network'), fetchJSON('devices'), fetchJSON('dda'),
    ]);

    renderDashboard(overview, daily, funnel, rides, crashes, conversions, network, devices, dda);
    document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    console.error(e);
  }
  btn.disabled = false;
}

function renderDashboard(overview, daily, funnel, rides, crashes, conversions, network, devices, dda) {
  const o = overview;
  const totalSessions = o.sessions?.total || 0;
  const totalRides = o.rides?.total || 0;
  const completedRides = o.rides?.completed || 0;
  const steamClicks = o.conversions?.steam_clicks || 0;
  const roomsCreated = o.conversions?.rooms_created || 0;
  const stokersJoined = o.rooms?.stokers_joined || 0;
  const webrtcOk = o.rooms?.connected || 0;

  document.getElementById('content').innerHTML = `
    <!-- KPIs -->
    <div class="kpis">
      <div class="kpi"><div class="value">${fmt(totalSessions)}</div><div class="label">Sessions</div>
        <div class="sub">${fmt(o.sessions?.stokers || 0)} stokers</div></div>
      <div class="kpi"><div class="value">${fmt(totalRides)}</div><div class="label">Rides</div>
        <div class="sub">${fmt(completedRides)} completed (${pct(completedRides, totalRides)}%)</div></div>
      <div class="kpi"><div class="value">${fmt(steamClicks)}</div><div class="label">Steam Clicks</div>
        <div class="sub">${pct(steamClicks, totalSessions)}% of sessions</div></div>
      <div class="kpi"><div class="value">${fmt(roomsCreated)}</div><div class="label">Rooms</div>
        <div class="sub">${fmt(stokersJoined)} joined (${pct(stokersJoined, roomsCreated)}%)</div></div>
      <div class="kpi"><div class="value">${fmt(o.rides?.tutorials || 0)}</div><div class="label">Tutorials</div></div>
      <div class="kpi"><div class="value">${fmt(o.conversions?.replays || 0)}</div><div class="label">Replays</div></div>
    </div>

    <!-- Daily chart -->
    <div class="section">
      <h2>Daily Activity</h2>
      <div class="card" style="height:280px"><canvas id="chart-daily"></canvas></div>
    </div>

    <!-- Funnel -->
    <div class="section">
      <h2>Funnel</h2>
      <div class="grid-2">
        <div class="card">
          <h3>Tutorial Completion by Input</h3>
          ${renderTutorialTable(funnel.tutorial)}
        </div>
        <div class="card">
          <h3>Tutorial Phase Drop-off</h3>
          ${renderPhaseTable(funnel.tutorialPhases)}
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3>Solo → Multiplayer Conversion</h3>
        ${renderSoloToMp(funnel.soloToMp)}
      </div>
    </div>

    <!-- Rides -->
    <div class="section">
      <h2>Ride Performance</h2>
      <div class="grid-2">
        <div class="card">
          <h3>Completion by Level</h3>
          ${renderRidesTable(rides.byLevel)}
        </div>
        <div class="card">
          <h3>Abandonment Reasons</h3>
          ${renderAbandonsTable(rides.abandons)}
        </div>
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="card">
          <h3>Steering Feel vs Completion</h3>
          ${renderSimpleTable(rides.steeringFeel, ['feel_bucket', 'rides', 'completed', 'avg_crashes'])}
        </div>
        <div class="card">
          <h3>Bike Preset Popularity</h3>
          ${renderSimpleTable(rides.bikePresets, ['bike_preset', 'rides', 'unique_players', 'completed'])}
        </div>
      </div>
    </div>

    <!-- Crashes -->
    <div class="section">
      <h2>Crash Analysis</h2>
      <div class="grid-2">
        <div class="card" style="height:300px">
          <h3>Crash Heatmap</h3>
          <canvas id="chart-crashes"></canvas>
        </div>
        <div class="card">
          <h3>Timeout Locations</h3>
          ${renderSimpleTable(crashes.timeouts, ['level', 'difficulty', 'checkpoint', 'timeouts'])}
        </div>
      </div>
    </div>

    <!-- Conversions -->
    <div class="section">
      <h2>Conversions</h2>
      <div class="grid-2">
        <div class="card">
          <h3>By Action &amp; Context</h3>
          ${renderSimpleTable(conversions.byAction, ['action', 'context', 'clicks', 'unique_sessions'])}
        </div>
        <div class="card">
          <h3>Clip Engagement</h3>
          ${renderSimpleTable(conversions.clips, ['day', 'saved', 'shared', 'discarded'])}
        </div>
      </div>
    </div>

    <!-- Network -->
    <div class="section">
      <h2>Network Health</h2>
      <div class="grid-2">
        <div class="card">
          <h3>Room Stats</h3>
          ${renderNetworkHealth(network.roomHealth)}
        </div>
        <div class="card">
          <h3>Daily Disconnects</h3>
          ${renderSimpleTable(network.disconnects, ['day', 'disconnects', 'during_ride', 'reconnects'])}
        </div>
      </div>
    </div>

    <!-- Devices & Input -->
    <div class="section">
      <h2>Devices &amp; Input</h2>
      <div class="grid-2">
        <div class="card" style="height:260px">
          <h3>Device Types</h3>
          <canvas id="chart-devices"></canvas>
        </div>
        <div class="card">
          <h3>Input Methods (Rides)</h3>
          ${renderInputTable(devices.inputMethods)}
        </div>
      </div>
    </div>

    <!-- DDA -->
    <div class="section">
      <h2>Dynamic Difficulty</h2>
      <div class="grid-2">
        <div class="card">
          <h3>DDA Interventions</h3>
          ${renderSimpleTable(dda.interventions, ['assist_type', 'offered', 'accepted', 'declined'])}
        </div>
        <div class="card">
          <h3>DDA Impact on Completion</h3>
          ${renderSimpleTable(dda.rideImpact, ['dda_group', 'rides', 'completed', 'avg_crashes'])}
        </div>
      </div>
    </div>
  `;

  // -- Charts --

  // Daily activity
  const d = (daily.daily || []).reverse();
  if (d.length > 0) {
    makeChart('chart-daily', 'line', d.map(r => r.day), [
      { label: 'Sessions', data: d.map(r => r.sessions), borderColor: COLORS.blue, backgroundColor: COLORS.blueFill, fill: true, tension: 0.3 },
      { label: 'Rides', data: d.map(r => r.total_rides), borderColor: COLORS.green, backgroundColor: COLORS.greenFill, fill: true, tension: 0.3 },
      { label: 'Completed', data: d.map(r => r.completed_rides), borderColor: COLORS.yellow, borderDash: [4,4], tension: 0.3, fill: false },
    ]);
  }

  // Crash heatmap (bar chart by distance bucket)
  const ch = crashes.heatmap || [];
  if (ch.length > 0) {
    const levels = [...new Set(ch.map(r => r.level))];
    const buckets = [...new Set(ch.map(r => r.distance_bucket))].sort((a,b) => a - b);
    const ds = levels.map((lev, i) => ({
      label: lev,
      data: buckets.map(b => {
        const row = ch.find(r => r.level === lev && r.distance_bucket === b);
        return row ? row.crashes : 0;
      }),
      backgroundColor: [COLORS.blue, COLORS.green, COLORS.yellow, COLORS.red][i % 4],
    }));
    makeChart('chart-crashes', 'bar', buckets.map(b => b + 'm'), ds);
  }

  // Device types doughnut
  const devs = devices.devices || [];
  if (devs.length > 0) {
    makeChart('chart-devices', 'doughnut',
      devs.map(r => (r.device_type || 'unknown') + ' / ' + (r.platform || '?')),
      [{ data: devs.map(r => r.sessions), backgroundColor: [COLORS.blue, COLORS.green, COLORS.yellow, COLORS.red, COLORS.purple, COLORS.cyan] }],
      { plugins: { legend: { display: true, position: 'right', labels: { color: '#888' } } } }
    );
  }
}

// -- Table renderers --

function renderTutorialTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No tutorial data yet</div>';
  let html = '<table><tr><th>Input</th><th class="num">Started</th><th class="num">Completed</th><th class="num">%</th></tr>';
  rows.forEach(r => {
    const p = pct(r.completed, r.started);
    html += `<tr><td>${r.input_method || 'unknown'}</td><td class="num">${r.started}</td><td class="num">${r.completed}</td><td class="num ${p >= 60 ? 'good' : p >= 30 ? 'warn' : 'bad'}">${p}%</td></tr>`;
  });
  return html + '</table>';
}

function renderPhaseTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No phase data yet</div>';
  let html = '<table><tr><th>Phase</th><th>Name</th><th class="num">Done</th><th class="num">Avg Tries</th><th class="num">Avg Time</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.phase}</td><td>${r.phase_name || ''}</td><td class="num">${r.completions}</td><td class="num">${r.avg_attempts || 0}</td><td class="num">${r.avg_time_sec || 0}s</td></tr>`;
  });
  return html + '</table>';
}

function renderSoloToMp(data) {
  if (!data) return '<div class="empty">No data yet</div>';
  const roomPct = pct(data.created_rooms, data.solo_riders);
  const joinPct = pct(data.rooms_with_stoker, data.created_rooms);
  return `<table>
    <tr><td>Solo riders</td><td class="num">${fmt(data.solo_riders)}</td></tr>
    <tr><td>Created rooms</td><td class="num">${fmt(data.created_rooms)} <span class="pct">(${roomPct}%)</span></td></tr>
    <tr><td>Stoker joined</td><td class="num">${fmt(data.rooms_with_stoker)} <span class="pct">(${joinPct}% of rooms)</span></td></tr>
  </table>`;
}

function renderRidesTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No ride data yet</div>';
  let html = '<table><tr><th>Level</th><th>Diff</th><th>Input</th><th class="num">Att</th><th class="num">Done</th><th class="num">%</th><th class="num">Avg T</th><th class="num">Crashes</th></tr>';
  rows.forEach(r => {
    const p = pct(r.completions, r.attempts);
    html += `<tr><td>${r.level}</td><td>${r.difficulty || ''}</td><td>${r.input_method || ''}</td><td class="num">${r.attempts}</td><td class="num">${r.completions || 0}</td><td class="num ${p >= 60 ? 'good' : p >= 30 ? 'warn' : 'bad'}">${p}%</td><td class="num">${r.avg_time_sec || '-'}s</td><td class="num">${r.avg_crashes || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderAbandonsTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No abandonment data yet</div>';
  let html = '<table><tr><th>Level</th><th>Reason</th><th class="num">Count</th><th class="num">Avg Dist</th><th class="num">Crashes</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.level}</td><td>${r.abandon_reason}</td><td class="num">${r.abandonments}</td><td class="num">${r.avg_distance || 0}m</td><td class="num">${r.avg_crashes || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderNetworkHealth(data) {
  if (!data) return '<div class="empty">No network data yet</div>';
  const joinPct = pct(data.stokers_joined, data.total_rooms);
  const connPct = data.stokers_joined > 0 ? pct(data.webrtc_success, data.stokers_joined) : 0;
  return `<table>
    <tr><td>Total rooms</td><td class="num">${fmt(data.total_rooms)}</td></tr>
    <tr><td>Stokers joined</td><td class="num">${fmt(data.stokers_joined)} <span class="pct">(${joinPct}%)</span></td></tr>
    <tr><td>WebRTC success</td><td class="num ${connPct >= 90 ? 'good' : 'warn'}">${fmt(data.webrtc_success)} (${connPct}%)</td></tr>
    <tr><td>WebRTC failed</td><td class="num ${data.webrtc_failed > 0 ? 'bad' : ''}">${fmt(data.webrtc_failed)}</td></tr>
    <tr><td>P2P / Relay</td><td class="num">${fmt(data.p2p_connections)} / ${fmt(data.relay_connections)}</td></tr>
    <tr><td>P2P upgrades</td><td class="num">${fmt(data.p2p_upgrades)}</td></tr>
    <tr><td>Joined via URL</td><td class="num">${fmt(data.joined_via_url)}</td></tr>
    <tr><td>Total disconnects</td><td class="num ${(data.total_disconnects || 0) > 10 ? 'warn' : ''}">${fmt(data.total_disconnects)}</td></tr>
  </table>`;
}

function renderInputTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No input data yet</div>';
  const total = rows.reduce((s, r) => s + r.rides, 0);
  let html = '<table><tr><th>Method</th><th class="num">Rides</th><th class="num">%</th><th class="num">Completed</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.input_method}</td><td class="num">${r.rides}</td><td class="num pct">${pct(r.rides, total)}%</td><td class="num">${r.completed || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderSimpleTable(rows, cols) {
  if (!rows || rows.length === 0) return '<div class="empty">No data yet</div>';
  let html = '<table><tr>' + cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('') + '</tr>';
  rows.forEach(r => {
    html += '<tr>' + cols.map(c => `<td class="${typeof r[c] === 'number' ? 'num' : ''}">${r[c] != null ? r[c] : '-'}</td>`).join('') + '</tr>';
  });
  return html + '</table>';
}

// -- Init --
document.getElementById('days').addEventListener('change', loadAll);
document.getElementById('auto-refresh').addEventListener('change', (e) => {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (e.target.checked) autoTimer = setInterval(loadAll, 60000);
});

loadAll();
</script>
</body>
</html>
