<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandemonium Analytics</title>
<!-- defer: as a blocking head script, a slow or blocked jsdelivr left the page
     blank with nothing rendered at all — including the sign-in button. Charts
     are only drawn after an API round-trip, so deferring is safe, and
     makeChart() degrades to a placeholder if it never arrives. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 1.6em; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 0.85em; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .controls select, .controls button { background: #1a1d27; color: #e0e0e0; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; font-size: 0.85em; cursor: pointer; }
  .controls button { background: #2563eb; border-color: #2563eb; }
  .controls button:hover { background: #1d4ed8; }
  .controls button:disabled { opacity: 0.5; cursor: wait; }
  .status { font-size: 0.8em; color: #666; margin-left: auto; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { background: #1a1d27; border-radius: 10px; padding: 16px; text-align: center; }
  .kpi .value { font-size: 2em; font-weight: 700; color: #fff; }
  .kpi .label { font-size: 0.75em; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .sub { font-size: 0.8em; color: #666; margin-top: 2px; }

  /* Sections */
  .section { margin-bottom: 28px; }
  .section h2 { font-size: 1.1em; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .card { background: #1a1d27; border-radius: 10px; padding: 16px; }
  .card h3 { font-size: 0.9em; color: #aaa; margin-bottom: 10px; }
  .card canvas { max-height: 260px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
  th { text-align: left; color: #888; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #333; }
  td { padding: 6px 8px; border-bottom: 1px solid #1e2030; }
  tr:hover td { background: #1e2030; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pct { color: #60a5fa; }
  .warn { color: #fbbf24; }
  .good { color: #34d399; }
  .bad { color: #f87171; }

  .empty { color: #555; font-style: italic; padding: 20px; text-align: center; }
  .loading { text-align: center; padding: 40px; color: #555; }
</style>
</head>
<body>

<h1>Tandemonium Analytics</h1>
<div class="subtitle">Steam Next Fest Dashboard</div>

<!-- Auth gate: shown when not signed in.

     Built with the GIS *JavaScript* API rather than the declarative
     g_id_onload/g_id_signin markup. The declarative form has no error channel
     at all: when Google can't deliver the credential back to the page, the
     popup just closes and the callback never fires — the reported "it tries
     but never completes". initialize()+prompt() give us notification moments
     that name the reason (unregistered_origin, suppressed_by_user, …), so the
     failure is visible instead of silent. -->
<div id="auth-gate" style="text-align:center;padding:60px 20px;">
  <p style="color:#888;margin-bottom:20px;">Sign in with an authorized Google account to view the dashboard.</p>
  <div id="gsi-button" style="display:flex;justify-content:center;"></div>
  <!-- Says what stage sign-in reached, so a stall is never a blank screen. -->
  <p id="auth-status" style="color:#666;font-size:0.85em;margin-top:16px;min-height:1.2em;"></p>
  <button id="auth-diagnose" onclick="diagnoseSignIn()"
          style="margin-top:4px;padding:6px 14px;background:#333;color:#ccc;border:1px solid #555;border-radius:6px;cursor:pointer;font-size:0.8em;">
    Sign-in stuck? Diagnose
  </button>
</div>

<!-- Dashboard controls: shown when signed in -->
<div id="dashboard-ui" style="display:none;">
  <div class="controls">
    <select id="days">
      <option value="1">Last 24 hours</option>
      <option value="7" selected>Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <button id="refresh" onclick="loadAll()">Refresh</button>
    <label style="font-size:0.82em;"><input type="checkbox" id="auto-refresh"> Auto-refresh 60s</label>
    <label style="font-size:0.82em;"><input type="checkbox" id="exclude-dev" onchange="onExcludeToggle()"> Exclude developer</label>
    <button id="exclude-edit-btn" onclick="toggleExcludePanel()" style="background:#333;border-color:#555;font-size:0.78em;">Edit exclusions</button>
    <span class="status" id="status">Loading...</span>
    <button onclick="signOut()" style="background:#333;border-color:#555;margin-left:8px;">Sign out</button>
  </div>

  <!-- Exclusion editor panel -->
  <div id="exclude-panel" style="display:none;background:#1a1d27;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:16px;">
    <h3 style="font-size:0.9em;color:#aaa;margin-bottom:10px;">Developer Session Exclusions</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <label style="font-size:0.8em;color:#888;">Excluded IPs (one per line)</label>
        <textarea id="exclude-ips" rows="4" style="width:100%;background:#0f1117;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:8px;font-size:0.82em;font-family:monospace;margin-top:4px;resize:vertical;"></textarea>
        <button onclick="autoDetectIPs()" style="background:#333;border-color:#555;font-size:0.75em;margin-top:4px;">Auto-detect my IPs</button>
      </div>
      <div>
        <label style="font-size:0.8em;color:#888;">Excluded Google UIDs (one per line)</label>
        <textarea id="exclude-uids" rows="4" style="width:100%;background:#0f1117;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:8px;font-size:0.82em;font-family:monospace;margin-top:4px;resize:vertical;"></textarea>
      </div>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px;">
      <button onclick="saveExclusions()" style="font-size:0.82em;">Save & Refresh</button>
      <button onclick="toggleExcludePanel()" style="background:#333;border-color:#555;font-size:0.82em;">Cancel</button>
    </div>
  </div>
  <div id="content"><div class="loading">Loading dashboard...</div></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
const API_BASE = 'https://tandemonium-api.pete-872.workers.dev';
const API = API_BASE + '/api/analytics/dashboard';
let charts = {};
let autoTimer = null;
let dashToken = sessionStorage.getItem('dash_token');

// ── Google Sign-In ──

// Show why sign-in failed instead of one catch-all "access denied" — a rejected
// account, an expired token, a worker misconfiguration and an unreachable API
// all used to look identical here, which made this impossible to diagnose.
function showAuthError(message, detail) {
  const gate = document.getElementById('auth-gate');
  gate.innerHTML =
    '<p style="color:#f87171;font-weight:600;">Can\'t sign in to the dashboard</p>' +
    '<p style="color:#aaa;margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto;">' +
      escapeHtml(message) + '</p>' +
    (detail ? '<p style="color:#666;font-size:0.8em;margin-top:6px;">' + escapeHtml(detail) + '</p>' : '') +
    '<button onclick="hardReset()" style="margin-top:12px;padding:8px 16px;background:#333;color:#fff;border:1px solid #555;border-radius:6px;cursor:pointer;">Try again</button>';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function setAuthStatus(msg) {
  const el = document.getElementById('auth-status');
  if (el) el.textContent = msg || '';
  if (msg) console.log('[dash-auth]', msg);
}

// Nothing below may wait forever. A sign-in that stalls with no message is
// the hardest state to debug, so every stage either finishes or says why not.
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(label + ' timed out after ' + (ms / 1000) + 's')), ms)),
  ]);
}

const GOOGLE_CLIENT_ID = '640682648249-dp1dou0mmpkm6m697oakbe9odabt1dui.apps.googleusercontent.com';
const REDIRECT_LOGIN_URI = API_BASE + '/auth/google/redirect';

// On iOS every browser — Chrome and Edge included — is WebKit, and ITP breaks
// the popup flow's postMessage of the credential back to the opener: you pick
// an account and nothing ever comes back. Redirect mode has no cross-window
// hop, so it works there. Sticky once chosen, so a browser that needed it
// keeps using it.
function isWebKitMobile() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function useRedirectMode() {
  try { if (localStorage.getItem('dash_force_redirect') === '1') return true; } catch (e) {}
  return isWebKitMobile();
}
function forceRedirectMode() {
  try { localStorage.setItem('dash_force_redirect', '1'); } catch (e) {}
  location.reload();
}

// Redirect mode hands the session back in the URL fragment (never sent to a
// server, unlike a query string). Consume it and scrub it from the address bar
// so it doesn't linger in history or get shared by copy-paste.
let redirectErrored = false;
function consumeRedirectResult() {
  const hash = location.hash.replace(/^#/, '');
  if (!hash) return false;
  const params = new URLSearchParams(hash);
  const token = params.get('dash_token');
  const error = params.get('dash_error');
  if (!token && !error) return false;

  history.replaceState(null, '', location.pathname + location.search);
  if (token) {
    dashToken = token;
    sessionStorage.setItem('dash_token', token);
    return true;
  }
  // Leave any stored session alone — a failed re-auth shouldn't log you out —
  // but the error must stand rather than being replaced by the saved-session
  // probe quietly succeeding underneath it.
  redirectErrored = true;
  showAuthError(error, 'returned by /auth/google/redirect');
  showRedirectButton();
  return false;
}

// Set when the Google button is clicked; cleared once a credential arrives.
// A popup that opens, takes the account choice and never calls back leaves
// this set — that is the signature of the reported hang.
let signInStartedAt = 0;
let signInWatchdog = null;

function gsiReady() {
  return typeof google !== 'undefined' && google.accounts && google.accounts.id;
}

function initGSI() {
  const redirect = useRedirectMode();

  google.accounts.id.initialize(redirect ? {
    client_id: GOOGLE_CLIENT_ID,
    ux_mode: 'redirect',
    login_uri: REDIRECT_LOGIN_URI,
    itp_support: true,
  } : {
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleSignIn,
    auto_select: true,
    // Both matter in Chrome since the third-party-cookie phase-out: without
    // them the prompt is suppressed and no callback ever arrives.
    use_fedcm_for_prompt: true,
    itp_support: true,
  });

  const container = document.getElementById('gsi-button');
  google.accounts.id.renderButton(container, {
    type: 'standard', theme: 'filled_black', size: 'large', text: 'sign_in_with',
  });

  if (redirect) {
    // Nothing to watchdog: the page navigates away and comes back with a
    // token in the fragment, so a failure surfaces as dash_error instead.
    setAuthStatus('Ready. Choosing an account will send you to Google and back.');
    return;
  }

  // The rendered button is a cross-origin iframe, so we can't hook its click
  // directly — but a pointerdown anywhere on it is close enough to start the
  // watchdog that catches "popup never returns".
  container.addEventListener('pointerdown', armSignInWatchdog, true);
  setAuthStatus('Ready. Choose your Google account to continue.');
}

function armSignInWatchdog() {
  signInStartedAt = Date.now();
  setAuthStatus('Waiting for Google to return your sign-in…');
  clearTimeout(signInWatchdog);
  signInWatchdog = setTimeout(() => {
    if (!signInStartedAt) return; // credential arrived; nothing to report
    setAuthStatus('');
    showAuthError(
      'Google never returned a sign-in to this page. The popup opened and took ' +
      'your account, but the credential was not delivered back — so the dashboard ' +
      'was never told who you are. This is what blocked third-party cookies for ' +
      'accounts.google.com looks like. The redirect flow below avoids the popup ' +
      'entirely and works even when cookies are restricted.',
      'No credential callback within 60s of ' + location.origin);
    showRedirectButton();
    showDiagnoseButton();
  }, 60000);
}

// Google's script is a common silent casualty of ad/tracker blockers and
// locked-down networks: it fails to load, no button appears, nothing errors.
window.addEventListener('DOMContentLoaded', () => {
  // Coming back from redirect-mode sign-in: the token is already consumed
  // from the fragment, so go straight in.
  if (cameFromRedirect) { showDashboard(); return; }
  if (dashToken) return; // the saved-session probe handles this case
  const deadline = Date.now() + 8000;
  (function waitForGSI() {
    if (gsiReady()) { initGSI(); return; }
    if (Date.now() > deadline) {
      showAuthError(
        "Google's sign-in library did not load, so the sign-in button can't work. " +
        'This is usually a tracker/ad blocker, a privacy extension, or a network ' +
        'that blocks accounts.google.com. Try again in a private window with ' +
        'extensions disabled, or on another network.',
        'https://accounts.google.com/gsi/client did not initialize within 8s');
      return;
    }
    setTimeout(waitForGSI, 200);
  })();
});

// Ask Google why nothing happened. The notification moment carries reasons the
// silent popup never surfaces — `unregistered_origin` in particular means this
// site is missing from the OAuth client's Authorized JavaScript origins.
function diagnoseSignIn() {
  if (!gsiReady()) {
    showAuthError("Google's sign-in library isn't loaded, so there is nothing to diagnose. " +
      'Check for a blocker on accounts.google.com.', null);
    return;
  }
  setAuthStatus('Asking Google why sign-in did not complete…');
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  google.accounts.id.prompt((n) => {
    const reasons = [];
    const read = (has, get) => {
      try { if (typeof n[has] === 'function' && n[has]()) reasons.push(has + ': ' + n[get]()); }
      catch (e) { /* several of these are unavailable under FedCM */ }
    };
    read('isNotDisplayed', 'getNotDisplayedReason');
    read('isSkippedMoment', 'getSkippedReason');
    read('isDismissedMoment', 'getDismissedReason');
    const detail = reasons.join(' · ') || 'Google reported no specific reason';
    console.log('[dash-auth] prompt moment:', detail, n);

    if (/unregistered_origin/.test(detail)) {
      showAuthError(
        location.origin + ' is not an Authorized JavaScript origin on the Google ' +
        'OAuth client, so Google refuses to hand a credential back to this page. ' +
        'Add it under APIs & Services → Credentials → the OAuth 2.0 Client ID → ' +
        'Authorized JavaScript origins.', detail);
    } else if (/secure_http_required/.test(detail)) {
      showAuthError('Google requires HTTPS for sign-in and this page is not served over it.', detail);
    } else if (/opt_out_or_no_session/.test(detail)) {
      showAuthError("You're not signed in to Google in this browser, or you've opted out of " +
        'One Tap for this site. Sign in to your Google account in another tab, then retry.', detail);
    } else if (/suppressed_by_user/.test(detail)) {
      showAuthError('Google has suppressed the sign-in prompt for this site because it was ' +
        'dismissed repeatedly. Clear cookies for accounts.google.com, or try a private window.', detail);
    } else {
      showAuthError('Google did not report a specific reason. The most common remaining causes ' +
        'are blocked third-party cookies for accounts.google.com, or a browser extension ' +
        'interfering with the sign-in popup. Try a private window with extensions off.', detail);
    }
    showDiagnoseButton();
  });
}

// showAuthError() replaces the gate's contents, which removes these buttons —
// put them back so the next attempt is always one click away.
function addGateButton(id, label, onclick, primary) {
  const gate = document.getElementById('auth-gate');
  if (document.getElementById(id)) return;
  const btn = document.createElement('button');
  btn.id = id;
  btn.textContent = label;
  btn.style.cssText = 'margin:12px 4px 0;padding:8px 16px;border-radius:6px;cursor:pointer;' +
    (primary ? 'background:#2563eb;color:#fff;border:1px solid #2563eb;'
             : 'background:#333;color:#ccc;border:1px solid #555;');
  btn.onclick = onclick;
  gate.appendChild(btn);
}

function showDiagnoseButton() {
  addGateButton('auth-diagnose', 'Ask Google why', diagnoseSignIn, false);
}

// The escape hatch from a popup that never returns.
function showRedirectButton() {
  addGateButton('auth-redirect', 'Sign in without the popup', forceRedirectMode, true);
}

// Clear the token and drop Google's auto-select so "Try again" can actually
// pick a different account rather than silently re-submitting the rejected one.
function hardReset() {
  dashToken = null;
  sessionStorage.removeItem('dash_token');
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  location.reload();
}

async function onGoogleSignIn(response) {
  // Reaching here at all means Google handed back a credential — worth saying,
  // because a stall before this point is a Google problem and a stall after it
  // is ours, and the two need completely different fixes.
  signInStartedAt = 0;
  clearTimeout(signInWatchdog);
  setAuthStatus('Google sign-in accepted — exchanging it with the analytics API…');

  let r;
  try {
    r = await withTimeout(fetch(API_BASE + '/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    }), 15000, 'POST /auth/google');
  } catch (e) {
    showAuthError('Could not reach the analytics API. Check your connection, then try again.',
      API_BASE + '/auth/google — ' + e.message);
    return;
  }

  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    showAuthError(data.error || 'The server rejected the Google sign-in.',
      'POST /auth/google returned ' + r.status);
    return;
  }
  if (!data.token) {
    showAuthError('The server did not return a session token.', 'POST /auth/google returned 200 with no token');
    return;
  }

  dashToken = data.token;
  sessionStorage.setItem('dash_token', dashToken);
  showDashboard();
}

function signOut() {
  hardReset();
}

function showDashboard() {
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('dashboard-ui').style.display = '';
  // Seed default exclusion UIDs on first use
  if (!localStorage.getItem('dash_exclusions')) {
    setExclusions({ ips: [], uids: ['pete@usersfirst.com', 'pete@petegordon.com'] });
  }
  loadAll();
}

// Must run before the probe below: a token arriving from redirect-mode
// sign-in supersedes whatever is in sessionStorage, and letting the probe
// validate a stale token first could reload the fresh one away.
const cameFromRedirect = consumeRedirectResult();

// Auto-login if we have a stored token — verify it still works.
// Only an auth rejection clears the token: a 429 from the read limiter or a
// worker 500 used to sign you out here, and with Google auto-select on that
// turned into an endless sign-in → reject → reload loop.
if (dashToken && !cameFromRedirect && !redirectErrored) {
  setAuthStatus('Checking your saved session…');
  withTimeout(fetch(API + '/overview?days=1', { headers: { 'Authorization': 'Bearer ' + dashToken } }),
    15000, 'GET /overview')
    .then(async r => {
      if (r.ok) { showDashboard(); return; }
      const data = await r.json().catch(() => ({}));
      if (r.status === 403) {
        // The account will never be allowed — stop, don't re-prompt Google.
        dashToken = null;
        sessionStorage.removeItem('dash_token');
        try { google.accounts.id.disableAutoSelect(); } catch (e) {}
        showAuthError(data.error || 'This Google account is not authorized for the dashboard.',
          'GET /overview returned 403');
      } else if (r.status === 401) {
        hardReset(); // stale/expired token — a fresh sign-in should work
      } else {
        showAuthError('The analytics API returned an error. Your sign-in is still valid — try again.',
          'GET /overview returned ' + r.status);
      }
    })
    .catch(e => showAuthError('Could not reach the analytics API.', e.message));
}

function getDays() { return document.getElementById('days').value; }

// ── Exclusion state (persisted in localStorage) ──
function getExclusions() {
  try {
    return JSON.parse(localStorage.getItem('dash_exclusions') || '{}');
  } catch { return {}; }
}
function setExclusions(obj) {
  localStorage.setItem('dash_exclusions', JSON.stringify(obj));
}
function isExcludeEnabled() {
  return document.getElementById('exclude-dev')?.checked || false;
}

async function fetchJSON(route) {
  const headers = {};
  if (dashToken) headers['Authorization'] = 'Bearer ' + dashToken;
  let url = `${API}/${route}?days=${getDays()}`;

  // Append exclusion params if toggle is on
  if (isExcludeEnabled()) {
    const ex = getExclusions();
    if (ex.ips && ex.ips.length) url += '&exclude_ips=' + encodeURIComponent(ex.ips.join(','));
    if (ex.uids && ex.uids.length) url += '&exclude_uids=' + encodeURIComponent(ex.uids.join(','));
  }

  const r = await withTimeout(fetch(url, { headers }), 20000, route);
  // 401 = stale token, worth a fresh sign-in. 403 = this account isn't allowed,
  // so reloading into Google again would just loop — say so and stay put.
  if (r.status === 401) { hardReset(); throw new Error('Session expired'); }
  if (r.status === 403) {
    const data = await r.json().catch(() => ({}));
    throw new Error(data.error || 'Not authorized for the dashboard');
  }
  if (!r.ok) throw new Error(`${route}: ${r.status}`);
  return r.json();
}

function pct(n, d) { return d > 0 ? Math.round(n * 1000 / d) / 10 : 0; }
function fmt(n) { return n != null ? Number(n).toLocaleString() : '0'; }

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

const COLORS = {
  blue: '#3b82f6', green: '#34d399', yellow: '#fbbf24', red: '#f87171',
  purple: '#a78bfa', cyan: '#22d3ee', orange: '#fb923c', pink: '#f472b6',
  blueFill: 'rgba(59,130,246,0.15)', greenFill: 'rgba(52,211,153,0.15)',
};

function makeChart(id, type, labels, datasets, opts = {}) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (typeof Chart === 'undefined') {
    // Chart.js blocked or still loading — the numbers above it are the real
    // content, so lose the graph rather than the whole dashboard.
    ctx.replaceWith(Object.assign(document.createElement('div'), {
      className: 'empty', textContent: 'Chart library unavailable',
    }));
    return;
  }
  charts[id] = new Chart(ctx, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { color: '#888', boxWidth: 12 } } },
      scales: type === 'doughnut' || type === 'pie' ? {} : {
        x: { ticks: { color: '#666', maxRotation: 45 }, grid: { color: '#1e2030' } },
        y: { ticks: { color: '#666' }, grid: { color: '#1e2030' }, beginAtZero: true, ...opts.y },
      },
      ...opts,
    }
  });
}

async function loadAll() {
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Loading...';
  destroyCharts();

  try {
    const [overview, daily, funnel, rides, crashes, conversions, network, devices, dda] = await Promise.all([
      fetchJSON('overview'), fetchJSON('daily'), fetchJSON('funnel'),
      fetchJSON('rides'), fetchJSON('crashes'), fetchJSON('conversions'),
      fetchJSON('network'), fetchJSON('devices'), fetchJSON('dda'),
    ]);

    renderDashboard(overview, daily, funnel, rides, crashes, conversions, network, devices, dda);
    document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    console.error(e);
  }
  btn.disabled = false;
}

function renderDashboard(overview, daily, funnel, rides, crashes, conversions, network, devices, dda) {
  const o = overview;
  const totalSessions = o.sessions?.total || 0;
  const totalRides = o.rides?.total || 0;
  const completedRides = o.rides?.completed || 0;
  const steamClicks = o.conversions?.steam_clicks || 0;
  const roomsCreated = o.conversions?.rooms_created || 0;
  const stokersJoined = o.rooms?.stokers_joined || 0;
  const webrtcOk = o.rooms?.connected || 0;

  document.getElementById('content').innerHTML = `
    <!-- KPIs -->
    <div class="kpis">
      <div class="kpi"><div class="value">${fmt(totalSessions)}</div><div class="label">Sessions</div>
        <div class="sub">${fmt(o.sessions?.stokers || 0)} stokers</div></div>
      <div class="kpi"><div class="value">${fmt(totalRides)}</div><div class="label">Rides</div>
        <div class="sub">${fmt(completedRides)} completed (${pct(completedRides, totalRides)}%)</div></div>
      <div class="kpi"><div class="value">${fmt(steamClicks)}</div><div class="label">Steam Clicks</div>
        <div class="sub">${pct(steamClicks, totalSessions)}% of sessions</div></div>
      <div class="kpi"><div class="value">${fmt(roomsCreated)}</div><div class="label">Rooms</div>
        <div class="sub">${fmt(stokersJoined)} joined (${pct(stokersJoined, roomsCreated)}%)</div></div>
      <div class="kpi"><div class="value">${fmt(o.rides?.tutorials || 0)}</div><div class="label">Tutorials</div></div>
      <div class="kpi"><div class="value">${fmt(o.conversions?.replays || 0)}</div><div class="label">Replays</div></div>
    </div>

    <!-- Daily chart -->
    <div class="section">
      <h2>Daily Activity</h2>
      <div class="card" style="height:280px"><canvas id="chart-daily"></canvas></div>
    </div>

    <!-- Funnel -->
    <div class="section">
      <h2>Funnel</h2>
      <div class="grid-2">
        <div class="card">
          <h3>Tutorial Completion by Input</h3>
          ${renderTutorialTable(funnel.tutorial)}
        </div>
        <div class="card">
          <h3>Tutorial Phase Drop-off</h3>
          ${renderPhaseTable(funnel.tutorialPhases)}
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3>Solo → Multiplayer Conversion</h3>
        ${renderSoloToMp(funnel.soloToMp)}
      </div>
    </div>

    <!-- Rides -->
    <div class="section">
      <h2>Ride Performance</h2>
      <div class="grid-2">
        <div class="card">
          <h3>Completion by Level</h3>
          ${renderRidesTable(rides.byLevel)}
        </div>
        <div class="card">
          <h3>Abandonment Reasons</h3>
          ${renderAbandonsTable(rides.abandons)}
        </div>
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="card">
          <h3>Steering Feel vs Completion</h3>
          ${renderSimpleTable(rides.steeringFeel, ['feel_bucket', 'rides', 'completed', 'avg_crashes'])}
        </div>
        <div class="card">
          <h3>Bike Preset Popularity</h3>
          ${renderSimpleTable(rides.bikePresets, ['bike_preset', 'rides', 'unique_players', 'completed'])}
        </div>
        <div class="card">
          <h3>FPS by Device / Platform</h3>
          ${renderPerformanceTable(rides.performance)}
        </div>
      </div>
    </div>

    <!-- Crashes -->
    <div class="section">
      <h2>Crash Analysis</h2>
      <div class="grid-2">
        <div class="card" style="height:300px">
          <h3>Crash Heatmap</h3>
          <canvas id="chart-crashes"></canvas>
        </div>
        <div class="card">
          <h3>Timeout Locations</h3>
          ${renderSimpleTable(crashes.timeouts, ['level', 'difficulty', 'checkpoint', 'timeouts'])}
        </div>
        <div class="card">
          <h3>Crashes by Input Method</h3>
          ${renderSimpleTable(crashes.crashesByInput, ['input_method', 'cause', 'crashes'])}
        </div>
      </div>
    </div>

    <!-- Conversions -->
    <div class="section">
      <h2>Conversions</h2>
      <div class="grid-2">
        <div class="card">
          <h3>By Action &amp; Context</h3>
          ${renderSimpleTable(conversions.byAction, ['action', 'context', 'clicks', 'unique_sessions'])}
        </div>
        <div class="card">
          <h3>Clip Engagement</h3>
          ${renderSimpleTable(conversions.clips, ['day', 'saved', 'shared', 'discarded'])}
        </div>
      </div>
    </div>

    <!-- Network -->
    <div class="section">
      <h2>Network Health</h2>
      <div class="grid-2">
        <div class="card">
          <h3>Room Stats</h3>
          ${renderNetworkHealth(network.roomHealth)}
        </div>
        <div class="card">
          <h3>Daily Disconnects</h3>
          ${renderSimpleTable(network.disconnects, ['day', 'disconnects', 'during_ride', 'reconnects'])}
        </div>
        <div class="card">
          <h3>Connection Quality</h3>
          ${renderQualityTable(network.quality)}
        </div>
      </div>
    </div>

    <!-- Devices & Input -->
    <div class="section">
      <h2>Devices &amp; Input</h2>
      <div class="grid-2">
        <div class="card" style="height:260px">
          <h3>Device Types</h3>
          <canvas id="chart-devices"></canvas>
        </div>
        <div class="card">
          <h3>Input Methods (Rides)</h3>
          ${renderInputTable(devices.inputMethods)}
        </div>
        <div class="card">
          <h3>Controllers</h3>
          ${renderControllerTable(devices.controllers)}
        </div>
        <div class="card">
          <h3>Browsers &amp; OS</h3>
          ${renderBrowserTable(devices.browsers)}
        </div>
        <div class="card">
          <h3>Session Duration</h3>
          ${renderSessionDurationTable(devices.sessionDuration)}
        </div>
      </div>
    </div>

    <!-- DDA -->
    <div class="section">
      <h2>Dynamic Difficulty</h2>
      <div class="grid-2">
        <div class="card">
          <h3>DDA Interventions</h3>
          ${renderSimpleTable(dda.interventions, ['assist_type', 'offered', 'accepted', 'declined'])}
        </div>
        <div class="card">
          <h3>DDA Impact on Completion</h3>
          ${renderSimpleTable(dda.rideImpact, ['dda_group', 'rides', 'completed', 'avg_crashes'])}
        </div>
      </div>
    </div>
  `;

  // -- Charts --

  // Daily activity
  const d = (daily.daily || []).reverse();
  if (d.length > 0) {
    makeChart('chart-daily', 'line', d.map(r => r.day), [
      { label: 'Sessions', data: d.map(r => r.sessions), borderColor: COLORS.blue, backgroundColor: COLORS.blueFill, fill: true, tension: 0.3 },
      { label: 'Rides', data: d.map(r => r.total_rides), borderColor: COLORS.green, backgroundColor: COLORS.greenFill, fill: true, tension: 0.3 },
      { label: 'Completed', data: d.map(r => r.completed_rides), borderColor: COLORS.yellow, borderDash: [4,4], tension: 0.3, fill: false },
    ]);
  }

  // Crash heatmap (bar chart by distance bucket)
  const ch = crashes.heatmap || [];
  if (ch.length > 0) {
    const levels = [...new Set(ch.map(r => r.level))];
    const buckets = [...new Set(ch.map(r => r.distance_bucket))].sort((a,b) => a - b);
    const ds = levels.map((lev, i) => ({
      label: lev,
      data: buckets.map(b => {
        const row = ch.find(r => r.level === lev && r.distance_bucket === b);
        return row ? row.crashes : 0;
      }),
      backgroundColor: [COLORS.blue, COLORS.green, COLORS.yellow, COLORS.red][i % 4],
    }));
    makeChart('chart-crashes', 'bar', buckets.map(b => b + 'm'), ds);
  }

  // Device types doughnut
  const devs = devices.devices || [];
  if (devs.length > 0) {
    makeChart('chart-devices', 'doughnut',
      devs.map(r => (r.device_type || 'unknown') + ' / ' + (r.platform || '?')),
      [{ data: devs.map(r => r.sessions), backgroundColor: [COLORS.blue, COLORS.green, COLORS.yellow, COLORS.red, COLORS.purple, COLORS.cyan] }],
      { plugins: { legend: { display: true, position: 'right', labels: { color: '#888' } } } }
    );
  }
}

// -- Table renderers --

function renderTutorialTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No tutorial data yet</div>';
  let html = '<table><tr><th>Input</th><th class="num">Started</th><th class="num">Completed</th><th class="num">%</th></tr>';
  rows.forEach(r => {
    const p = pct(r.completed, r.started);
    html += `<tr><td>${r.input_method || 'unknown'}</td><td class="num">${r.started}</td><td class="num">${r.completed}</td><td class="num ${p >= 60 ? 'good' : p >= 30 ? 'warn' : 'bad'}">${p}%</td></tr>`;
  });
  return html + '</table>';
}

function renderPhaseTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No phase data yet</div>';
  let html = '<table><tr><th>Phase</th><th>Name</th><th class="num">Done</th><th class="num">Avg Tries</th><th class="num">Avg Time</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.phase}</td><td>${r.phase_name || ''}</td><td class="num">${r.completions}</td><td class="num">${r.avg_attempts || 0}</td><td class="num">${r.avg_time_sec || 0}s</td></tr>`;
  });
  return html + '</table>';
}

function renderSoloToMp(data) {
  if (!data) return '<div class="empty">No data yet</div>';
  const roomPct = pct(data.created_rooms, data.solo_riders);
  const joinPct = pct(data.rooms_with_stoker, data.created_rooms);
  return `<table>
    <tr><td>Solo riders</td><td class="num">${fmt(data.solo_riders)}</td></tr>
    <tr><td>Created rooms</td><td class="num">${fmt(data.created_rooms)} <span class="pct">(${roomPct}%)</span></td></tr>
    <tr><td>Stoker joined</td><td class="num">${fmt(data.rooms_with_stoker)} <span class="pct">(${joinPct}% of rooms)</span></td></tr>
  </table>`;
}

function renderRidesTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No ride data yet</div>';
  let html = '<table><tr><th>Level</th><th>Diff</th><th>Input</th><th class="num">Att</th><th class="num">Done</th><th class="num">%</th><th class="num">Avg T</th><th class="num">Crashes</th></tr>';
  rows.forEach(r => {
    const p = pct(r.completions, r.attempts);
    html += `<tr><td>${r.level}</td><td>${r.difficulty || ''}</td><td>${r.input_method || ''}</td><td class="num">${r.attempts}</td><td class="num">${r.completions || 0}</td><td class="num ${p >= 60 ? 'good' : p >= 30 ? 'warn' : 'bad'}">${p}%</td><td class="num">${r.avg_time_sec != null ? r.avg_time_sec + 's' : '-'}</td><td class="num">${r.avg_crashes || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderAbandonsTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No abandonment data yet</div>';
  let html = '<table><tr><th>Level</th><th>Reason</th><th class="num">Count</th><th class="num">Avg Dist</th><th class="num">Crashes</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.level}</td><td>${r.abandon_reason}</td><td class="num">${r.abandonments}</td><td class="num">${r.avg_distance || 0}m</td><td class="num">${r.avg_crashes || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderNetworkHealth(data) {
  if (!data) return '<div class="empty">No network data yet</div>';
  const joinPct = pct(data.stokers_joined, data.total_rooms);
  const connPct = data.stokers_joined > 0 ? pct(data.webrtc_success, data.stokers_joined) : 0;
  return `<table>
    <tr><td>Total rooms</td><td class="num">${fmt(data.total_rooms)}</td></tr>
    <tr><td>Stokers joined</td><td class="num">${fmt(data.stokers_joined)} <span class="pct">(${joinPct}%)</span></td></tr>
    <tr><td>WebRTC success</td><td class="num ${connPct >= 90 ? 'good' : 'warn'}">${fmt(data.webrtc_success)} (${connPct}%)</td></tr>
    <tr><td>WebRTC failed</td><td class="num ${data.webrtc_failed > 0 ? 'bad' : ''}">${fmt(data.webrtc_failed)}</td></tr>
    <tr><td>P2P / Relay</td><td class="num">${fmt(data.p2p_connections)} / ${fmt(data.relay_connections)}</td></tr>
    <tr><td>P2P upgrades</td><td class="num">${fmt(data.p2p_upgrades)}</td></tr>
    <tr><td>Joined via URL</td><td class="num">${fmt(data.joined_via_url)}</td></tr>
    <tr><td>Total disconnects</td><td class="num ${(data.total_disconnects || 0) > 10 ? 'warn' : ''}">${fmt(data.total_disconnects)}</td></tr>
  </table>`;
}

function renderInputTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No input data yet</div>';
  const total = rows.reduce((s, r) => s + r.rides, 0);
  let html = '<table><tr><th>Method</th><th class="num">Rides</th><th class="num">%</th><th class="num">Completed</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.input_method}</td><td class="num">${r.rides}</td><td class="num pct">${pct(r.rides, total)}%</td><td class="num">${r.completed || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderControllerTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No controller data yet</div>';
  const total = rows.reduce((s, r) => s + r.rides, 0);
  let html = '<table><tr><th>Controller</th><th>Connection</th><th class="num">Rides</th><th class="num">%</th><th class="num">Completed</th></tr>';
  rows.forEach(r => {
    html += `<tr><td>${r.controller_name}</td><td>${r.controller_connection || '-'}</td><td class="num">${r.rides}</td><td class="num pct">${pct(r.rides, total)}%</td><td class="num">${r.completed || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderBrowserTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No browser data yet</div>';
  // Parse user_agent strings into browser/OS buckets
  const buckets = {};
  rows.forEach(r => {
    const ua = r.user_agent || '';
    const browser = parseUABrowser(ua);
    const os = parseUAOS(ua);
    const key = browser + ' / ' + os;
    buckets[key] = (buckets[key] || 0) + r.sessions;
  });
  const sorted = Object.entries(buckets).sort((a, b) => b[1] - a[1]);
  const total = sorted.reduce((s, e) => s + e[1], 0);
  let html = '<table><tr><th>Browser / OS</th><th class="num">Sessions</th><th class="num">%</th></tr>';
  sorted.forEach(([key, count]) => {
    html += `<tr><td>${key}</td><td class="num">${count}</td><td class="num pct">${pct(count, total)}%</td></tr>`;
  });
  return html + '</table>';
}

function parseUABrowser(ua) {
  if (ua.includes('Electron')) return 'Steam/Electron';
  if (ua.includes('Edg/')) return 'Edge';
  if (ua.includes('OPR/') || ua.includes('Opera')) return 'Opera';
  if (ua.includes('Chrome/') && !ua.includes('Edg/')) return 'Chrome';
  if (ua.includes('Safari/') && !ua.includes('Chrome')) return 'Safari';
  if (ua.includes('Firefox/')) return 'Firefox';
  return 'Other';
}

function parseUAOS(ua) {
  if (ua.includes('iPhone')) {
    // Extract iOS version: "iPhone OS 17_4" → "iOS 17.4"
    const ver = ua.match(/iPhone OS (\d+[_\.]\d+)/);
    return ver ? 'iOS ' + ver[1].replace('_', '.') : 'iOS (iPhone)';
  }
  if (ua.includes('iPad')) {
    const ver = ua.match(/CPU OS (\d+[_\.]\d+)/);
    return ver ? 'iPadOS ' + ver[1].replace('_', '.') : 'iPadOS';
  }
  if (ua.includes('Android')) {
    // Extract model: "Android 14; SM-S918B" → "Android 14 (SM-S918B)"
    const ver = ua.match(/Android ([\d.]+)/);
    const model = ua.match(/;\s*([^;)]+)\s*(?:Build|[)])/);
    let result = ver ? 'Android ' + ver[1] : 'Android';
    if (model && model[1].trim()) result += ' (' + model[1].trim() + ')';
    return result;
  }
  if (ua.includes('Mac OS X')) return 'macOS';
  if (ua.includes('Windows')) return 'Windows';
  if (ua.includes('Linux')) return 'Linux';
  if (ua.includes('CrOS')) return 'ChromeOS';
  return 'Other';
}

function renderSessionDurationTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No duration data yet</div>';
  let html = '<table><tr><th>Device</th><th class="num">Sessions</th><th class="num">Avg Duration</th></tr>';
  rows.forEach(r => {
    const dur = r.avg_duration_min != null ? r.avg_duration_min + ' min' : '-';
    html += `<tr><td>${r.device_type || 'unknown'}</td><td class="num">${r.sessions}</td><td class="num">${dur}</td></tr>`;
  });
  return html + '</table>';
}

function renderQualityTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No quality data yet</div>';
  let html = '<table><tr><th>Transport</th><th class="num">Rooms</th><th class="num">Avg RTT</th><th class="num">Avg Max RTT</th><th class="num">Packet Loss</th></tr>';
  rows.forEach(r => {
    const rttClass = r.avg_rtt_ms <= 50 ? 'good' : r.avg_rtt_ms <= 150 ? 'warn' : 'bad';
    const lossClass = r.avg_packet_loss_pct <= 1 ? 'good' : r.avg_packet_loss_pct <= 5 ? 'warn' : 'bad';
    html += `<tr><td>${r.connection_type || '?'}</td><td class="num">${r.rooms}</td><td class="num ${rttClass}">${r.avg_rtt_ms != null ? r.avg_rtt_ms + 'ms' : '-'}</td><td class="num">${r.avg_max_rtt_ms != null ? r.avg_max_rtt_ms + 'ms' : '-'}</td><td class="num ${lossClass}">${r.avg_packet_loss_pct != null ? r.avg_packet_loss_pct + '%' : '-'}</td></tr>`;
  });
  return html + '</table>';
}

function renderPerformanceTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No FPS data yet</div>';
  let html = '<table><tr><th>Device</th><th>Platform</th><th class="num">Avg FPS</th><th class="num">Avg Min FPS</th><th class="num">Rides</th><th class="num">Completed</th></tr>';
  rows.forEach(r => {
    const fpsClass = r.avg_fps >= 55 ? 'good' : r.avg_fps >= 30 ? 'warn' : 'bad';
    const minClass = r.avg_min_fps >= 30 ? 'good' : r.avg_min_fps >= 15 ? 'warn' : 'bad';
    html += `<tr><td>${r.device_type || 'unknown'}</td><td>${r.platform || '?'}</td><td class="num ${fpsClass}">${r.avg_fps || '-'}</td><td class="num ${minClass}">${r.avg_min_fps || '-'}</td><td class="num">${r.rides}</td><td class="num">${r.completed || 0}</td></tr>`;
  });
  return html + '</table>';
}

function renderSimpleTable(rows, cols) {
  if (!rows || rows.length === 0) return '<div class="empty">No data yet</div>';
  let html = '<table><tr>' + cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('') + '</tr>';
  rows.forEach(r => {
    html += '<tr>' + cols.map(c => `<td class="${typeof r[c] === 'number' ? 'num' : ''}">${r[c] != null ? r[c] : '-'}</td>`).join('') + '</tr>';
  });
  return html + '</table>';
}

// ── Exclusion UI ──
function onExcludeToggle() {
  localStorage.setItem('dash_exclude_on', isExcludeEnabled() ? '1' : '0');
  if (dashToken) loadAll();
}

function toggleExcludePanel() {
  const panel = document.getElementById('exclude-panel');
  const visible = panel.style.display !== 'none';
  if (!visible) {
    // Populate textareas from stored exclusions
    const ex = getExclusions();
    document.getElementById('exclude-ips').value = (ex.ips || []).join('\n');
    document.getElementById('exclude-uids').value = (ex.uids || []).join('\n');
  }
  panel.style.display = visible ? 'none' : 'block';
}

function saveExclusions() {
  const ips = document.getElementById('exclude-ips').value.split('\n').map(s => s.trim()).filter(Boolean);
  const uids = document.getElementById('exclude-uids').value.split('\n').map(s => s.trim()).filter(Boolean);
  setExclusions({ ips, uids });
  document.getElementById('exclude-panel').style.display = 'none';
  // Auto-enable the toggle
  document.getElementById('exclude-dev').checked = true;
  localStorage.setItem('dash_exclude_on', '1');
  if (dashToken) loadAll();
}

async function autoDetectIPs() {
  try {
    const headers = {};
    if (dashToken) headers['Authorization'] = 'Bearer ' + dashToken;
    const r = await fetch(`${API}/dev_ips`, { headers });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const textarea = document.getElementById('exclude-ips');
    const existing = textarea.value.split('\n').map(s => s.trim()).filter(Boolean);
    const merged = [...new Set([...existing, ...(data.ips || [])])];
    textarea.value = merged.join('\n');
  } catch (e) {
    alert('Failed to detect IPs: ' + e.message);
  }
}

// -- Init --
document.getElementById('days').addEventListener('change', () => { if (dashToken) loadAll(); });
document.getElementById('auto-refresh').addEventListener('change', (e) => {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (e.target.checked) autoTimer = setInterval(loadAll, 60000);
});

// Restore exclusion toggle state
if (localStorage.getItem('dash_exclude_on') === '1') {
  document.getElementById('exclude-dev').checked = true;
}
