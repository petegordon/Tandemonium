name: Deploy staging
# Third-party actions are pinned to a commit (the tag is in the comment).
# Every merge to main: tests, then the staging Workers and game at
# tandemonium-staging.housetandem.com. Production has its own workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts
      - name: Unit tests
        env:
          CLOUDFLARE_API_TOKEN: ''
        run: npm test
      - name: Deploy staging Workers
        working-directory: worker
        run: |
          for config in wrangler.toml wrangler-pad.toml wrangler-api.toml; do
            npx --yes wrangler@4.166.0 deploy --config "$config" --env staging
          done
      - name: Build the staging game
        env:
          CLOUDFLARE_API_TOKEN: ''
        run: node scripts/build-site.mjs --env staging --sha "$GITHUB_SHA"
      - name: Deploy the staging game
        run: npx --yes wrangler@4.166.0 deploy --config wrangler-site.jsonc --env staging
      - name: Check staging
        env:
          CLOUDFLARE_API_TOKEN: ''
        run: node scripts/check-staging.mjs --wait 180
