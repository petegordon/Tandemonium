name: Steam Upload

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Steam branch to deploy to'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - default

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: tandemonium-win32-x64
          path: builds/windows/
          run-id: ${{ github.event.workflow_run.id || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4482940
          buildDescription: 'Automated build from GitHub Actions'
          rootPath: builds
          depot1Path: windows
          releaseBranch: ${{ inputs.branch }}
