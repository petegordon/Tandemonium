name: PR Preview Deploy
# Third-party actions are pinned to a commit (the tag is in the comment): a tag can be moved
# to different code, a commit cannot. To update one, change both.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# This workflow only reads the repository.
permissions:
  contents: read

jobs:
  # Tests report on the PR as the `tests` check, but they don't gate the
  # PREVIEW: a flaky unrelated test once blocked a deploy and a phone tester
  # spent a round on a stale build without knowing. A broken build shows as a
  # red check next to a live preview instead of a silently old preview.
  # What stops a red build reaching production is deploy.yml, which runs the
  # unit tests itself and does not deploy if they fail. (Making `tests` a
  # required check for merging is a branch-protection setting on main, not
  # something this file can do.)
  tests:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Both gates below import js/ modules that pull in `three` (road-seed
      # exercises js/road-path.js), so dependencies have to be installed before
      # the first gate runs — not midway through, as they used to be.
      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts

      - name: Unit tests
        run: npm test

      # shared/ui is a vendored copy of @usersfirst/ui pinned by
      # shared/ui/UI_VERSION.json. Check the lab out at that commit (sparse:
      # only packages/ui) and compare byte for byte, so a hand-edit of shared/ui
      # or a stale sync fails the PR instead of drifting silently.
      - name: UI kit drift check (shared/ui vs the lab at its pinned commit)
        run: |
          ref=$(node -e 'process.stdout.write(require("./shared/ui/UI_VERSION.json").sourceCommit)')
          git clone --quiet --filter=blob:none --no-checkout https://github.com/UsersFirst/tandemonium-controller-lab.git ../tandemonium-controller-lab
          git -C ../tandemonium-controller-lab sparse-checkout set packages/ui
          git -C ../tandemonium-controller-lab checkout --quiet "$ref"
          npm run check:ui

      # shared/identity is the same kind of copy, of @usersfirst/identity (the sign-in
      # client js/auth.js is built on), pinned by shared/identity/IDENTITY_VERSION.json.
      - name: Identity drift check (shared/identity vs the lab at its pinned commit)
        run: |
          ref=$(node -e 'process.stdout.write(require("./shared/identity/IDENTITY_VERSION.json").sourceCommit)')
          git -C ../tandemonium-controller-lab sparse-checkout set packages/identity
          git -C ../tandemonium-controller-lab checkout --quiet "$ref"
          npm run check:identity

      # A-3 · the game has no build step, so a broken import only shows up when
      # someone opens the page. This opens it.
      - name: Lobby smoke test
        run: |
          npx puppeteer browsers install chrome
          npm run smoke
          # ...and again over an insecure context, which is how a phone reaches
          # the site from an http:// link. crypto.randomUUID is undefined there.
          npm run smoke:insecure

      # A fast subset of the headless smokes (puppeteer's own Chrome, launched
      # with --no-sandbox by each script): what each edition offers, the room's
      # camera/mic staying off, and the one coin wallet. They run side by side —
      # each serves the game on its own port — so the job stays a few minutes.
      # Lobby-level smokes only, one at a time. The ride smokes (no-media,
      # economy, …) need a full ride under software WebGL, which on a hosted
      # runner takes longer than their timeouts (and three Chromes in parallel
      # starve a 2-core runner). They run locally: see README smoke:*.
      - name: Smoke subset (lobby, edition)
        run: |
          fail=0
          for s in smoke smoke:edition; do
            if npm run -s "$s" > "smoke-log.txt" 2>&1; then status=passed; else status=FAILED; fail=1; fi
            echo "::group::$s — $status"
            cat smoke-log.txt
            echo "::endgroup::"
            if [ "$status" = FAILED ]; then echo "::error::$s failed"; fi
          done
          exit $fail

  preview:
    # Previews are served from the game's own address, next to the live game, so they are
    # built only from branches of this repository: never from a fork's pull request.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Previews serialize among themselves. deploy.yml has its own group
    # (gh-pages-main) so a burst of preview runs can't evict a pending main deploy;
    # it retries if a preview push races it. (#319)
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # Always check out — the cleanup path (PR closed/merged) also needs a
        # git repo, or pr-preview-action fails with "not in a git directory".
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # On pull_request the checkout is GitHub's merge of the PR into its
          # base. Depth 2 brings that merge's two parents: the base (HEAD^1) and
          # the PR's head (HEAD^2). The stage step compares against the base to
          # find the heavy files this PR changed; one commit is not enough.
          fetch-depth: 2

      # A preview is not a full copy of the game (#760): the heavy folders
      # (tandem-3d/, assets/, images/, goose-stage/reels/) hold only the files this
      # PR added or changed, and a service worker the preview registers fetches
      # the rest from the live game. scripts/stage-preview.mjs does the staging
      # (what is copied, the worker, the <base> tag, the version stamps) and
      # explains each part; scripts/smoke-preview-fallback.mjs tests it.
      - name: Stage deploy files
        if: github.event.action != 'closed'
        env:
          # Passed as environment, not pasted into the script text.
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The comparison below is only right on GitHub's merge commit (two
          # parents: the base, then the PR's head). Anything else: stop, don't guess.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::Expected a checkout of the PR's merge commit; cannot tell which heavy files this PR changed."
            exit 1
          fi
          # HEAD^1 is the base branch as merged, so HEAD^1...HEAD is exactly what
          # origin/<base>...HEAD would give, without fetching the base's history.
          node scripts/stage-preview.mjs --out _site --pr "$PR_NUMBER" --sha "$HEAD_SHA" --base 'HEAD^1'

      # Tourist Mode (#333) reads window.__TOURIST_MAPS_KEY__ from the gitignored
      # js/tourist-key.local.js (generated locally by `npm run gen-tourist-key`).
      # That file never enters git, so recreate it here from the GOOGLE_MAPS_API_KEY
      # secret — mirrors scripts/gen-tourist-key.js. The Map Tiles key is client-
      # side by design; keep it locked to the tandemonium.housetandem.com referrer +
      # Map Tiles API in Google Cloud so publishing it here is safe.
      - name: Inject Tourist Maps key
        if: github.event.action != 'closed'
        env:
          TOURIST_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          node -e 'require("fs").writeFileSync("_site/js/tourist-key.local.js", "window.__TOURIST_MAPS_KEY__ = " + JSON.stringify(process.env.TOURIST_MAPS_KEY || "") + ";\n")'

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./_site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
