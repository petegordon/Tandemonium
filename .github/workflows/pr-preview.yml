name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  # Tests report on the PR as the `tests` check, but they don't gate the
  # PREVIEW: a flaky unrelated test once blocked a deploy and a phone tester
  # spent a round on a stale build without knowing. A broken build shows as a
  # red check next to a live preview instead of a silently old preview.
  # What stops a red build reaching production is deploy.yml, which runs the
  # unit tests itself and does not deploy if they fail. (Making `tests` a
  # required check for merging is a branch-protection setting on main, not
  # something this file can do.)
  tests:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Both gates below import js/ modules that pull in `three` (road-seed
      # exercises js/road-path.js), so dependencies have to be installed before
      # the first gate runs — not midway through, as they used to be.
      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts || npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # A-3 · the game has no build step, so a broken import only shows up when
      # someone opens the page. This opens it.
      - name: Lobby smoke test
        run: |
          npx puppeteer browsers install chrome
          npm run smoke
          # ...and again over an insecure context, which is how a phone reaches
          # the site from an http:// link. crypto.randomUUID is undefined there.
          npm run smoke:insecure

      # A fast subset of the headless smokes (puppeteer's own Chrome, launched
      # with --no-sandbox by each script): what each edition offers, the room's
      # camera/mic staying off, and the one coin wallet. They run side by side —
      # each serves the game on its own port — so the job stays a few minutes.
      - name: Smoke subset (edition, no-media, economy)
        run: |
          pids=(); names=()
          for s in smoke:edition smoke:no-media smoke:economy; do
            npm run -s "$s" > "smoke-${s#smoke:}.log" 2>&1 &
            pids+=($!); names+=("$s")
          done
          fail=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then status=passed; else status=FAILED; fail=1; fi
            echo "::group::${names[$i]} — $status"
            cat "smoke-${names[$i]#smoke:}.log"
            echo "::endgroup::"
            if [ "$status" = FAILED ]; then echo "::error::${names[$i]} failed"; fi
          done
          exit $fail

  preview:
    runs-on: ubuntu-latest
    # Previews serialize among themselves. deploy.yml has its own group
    # (gh-pages-main) so a burst of preview runs can't evict a pending main deploy;
    # it retries if a preview push races it. (#319)
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # Always check out — the cleanup path (PR closed/merged) also needs a
        # git repo, or pr-preview-action fails with "not in a git directory".
        uses: actions/checkout@v4

      - name: Stage deploy files
        if: github.event.action != 'closed'
        run: |
          mkdir -p _site
          # Exclude .gitignore: it would be published into pr-preview/pr-N/ and
          # its `js/tourist-key.local.js` rule makes the gh-pages `git add` skip
          # the key file we inject below. Nothing it ignores needs publishing —
          # it's all already excluded here.
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' \
                   --exclude='node_modules' --exclude='out' --exclude='desktop' \
                   --exclude='electron' --exclude='scripts' --exclude='.env' \
                   ./ _site/
          # Inject <base> tag so relative asset paths resolve from the repo root,
          # not from the /pr-preview/pr-N/ subdirectory
          # Custom domain (CNAME) means no /repo-name/ prefix in URLs
          sed -i 's|<head>|<head><base href="/pr-preview/pr-${{ github.event.number }}/">|' _site/index.html
          # Stamp the previewed commit + time into the lobby footer so the
          # preview build's version is visible (tagged with the PR number).
          # The PR's HEAD commit, not `git rev-parse HEAD`: on pull_request
          # that is a merge commit whose hash matches nothing in `git log`.
          HASH=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          DATE=$(TZ='America/New_York' date '+%m-%d-%Y %H:%M')
          VERSION="v.$HASH | $DATE (PR #${{ github.event.number }})"
          # Delimiter '@' (not '#') — the version contains '#' from the PR number.
          sed -i -E "s@id=\"lobby-version\">[^<]*@id=\"lobby-version\">${VERSION}@" _site/index.html
          # Build identity for js/build-badge.js: an on-screen watermark, a
          # version.json to spot a newer deploy, and the sha stamped into the
          # module itself to spot stale cached game files.
          PR=${{ github.event.number }}
          echo "{\"sha\":\"$HASH\",\"pr\":$PR,\"time\":\"$DATE\"}" > _site/version.json
          sed -i "s|<head>|<head><script>window.__BUILD={sha:'$HASH',pr:$PR,time:'$DATE'}</script>|" _site/index.html
          sed -i "s|%%MODULE_SHA%%|$HASH|" _site/js/build-badge.js

      # Tourist Mode (#333) reads window.__TOURIST_MAPS_KEY__ from the gitignored
      # js/tourist-key.local.js (generated locally by `npm run gen-tourist-key`).
      # That file never enters git, so recreate it here from the GOOGLE_MAPS_API_KEY
      # secret — mirrors scripts/gen-tourist-key.js. The Map Tiles key is client-
      # side by design; keep it locked to the tandemonium.jimandi.love referrer +
      # Map Tiles API in Google Cloud so publishing it here is safe.
      - name: Inject Tourist Maps key
        if: github.event.action != 'closed'
        env:
          TOURIST_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          node -e 'require("fs").writeFileSync("_site/js/tourist-key.local.js", "window.__TOURIST_MAPS_KEY__ = " + JSON.stringify(process.env.TOURIST_MAPS_KEY || "") + ";\n")'

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
