name: Build & Deploy Windows

on:
  push:
    branches: [main, steam-publishing]
  workflow_dispatch:
    inputs:
      steam_branch:
        description: 'Steam branch to deploy to'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - default

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download vendor assets
        run: npm run download-vendors

      - name: Build desktop HTML
        run: npm run build-desktop

      - name: Package with Electron Forge
        run: npx electron-forge package --platform win32 --arch x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tandemonium-win32-x64
          path: out/Tandemonium-win32-x64/

  upload-to-steam:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/steam-publishing'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: tandemonium-win32-x64
          path: builds/windows/

      - name: Upload to Steam (Playtest)
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4510250
          buildDescription: 'Build ${{ github.sha }} from ${{ github.ref_name }}'
          rootPath: builds
          depot1Path: windows
          releaseBranch: ${{ inputs.steam_branch || 'beta' }}
