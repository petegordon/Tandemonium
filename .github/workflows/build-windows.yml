name: Build & Deploy (Windows + macOS)

on:
  push:
    branches: [main, steam-publishing]
  workflow_dispatch:
    inputs:
      steam_branch:
        description: 'Steam branch to deploy to'
        required: true
        default: 'dev-private'
        type: choice
        options:
          - dev-private
          - beta
          - default
      macos:
        description: 'Also build and upload the macOS depot (4510252)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download vendor assets
        run: npm run download-vendors

      - name: Stamp version in index.html
        shell: pwsh
        run: |
          $hash = git rev-parse --short HEAD
          $date = Get-Date -Format "MM-dd-yyyy HH:mm"
          $version = "v.$hash | $date"
          (Get-Content index.html) -replace 'id="lobby-version">[^<]+', "id=`"lobby-version`">$version" | Set-Content index.html

      - name: Build desktop HTML
        run: npm run build-desktop

      - name: Package with Electron Forge
        run: npx electron-forge package --platform win32 --arch x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tandemonium-win32-x64
          path: out/Tandemonium-win32-x64/

  # macOS (#192): universal .app, ad-hoc signed (Apple Silicon refuses
  # unsigned code; Steam downloads aren't quarantined, so no notarization yet).
  # Only runs when a Steam upload is wanted: macOS minutes are the slow ones.
  build-macos:
    runs-on: macos-14
    if: (github.event_name == 'workflow_dispatch' && inputs.macos) || github.ref == 'refs/heads/steam-publishing'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download vendor assets
        run: npm run download-vendors

      - name: Stamp version in index.html
        run: |
          VERSION="v.$(git rev-parse --short HEAD) | $(date '+%m-%d-%Y %H:%M') | mac"
          sed -i '' -E "s#id=\"lobby-version\">[^<]+#id=\"lobby-version\">$VERSION#" index.html

      - name: Build desktop HTML
        run: npm run build-desktop

      - name: Make the macOS icon
        run: bash scripts/make-icns.sh

      - name: Package with Electron Forge
        run: npx electron-forge package --platform darwin --arch universal

      - name: Ad-hoc sign
        run: |
          APP="out/Tandemonium-darwin-universal/Tandemonium.app"
          find "$APP" -type f -name '*.node' -print0 | xargs -0 -n1 codesign --force --sign -
          find "$APP" -type f -name '*.dylib' -print0 | xargs -0 -n1 codesign --force --sign -
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Tandemonium"

      # tar keeps the framework symlinks and exec bits that upload-artifact drops.
      - name: Pack the app
        run: tar -C out/Tandemonium-darwin-universal -czf tandemonium-macos.tgz Tandemonium.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandemonium-macos
          path: tandemonium-macos.tgz

  upload-to-steam:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    # build-macos may be skipped (macos input off); the Windows depot still goes.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/steam-publishing')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: tandemonium-win32-x64
          path: builds/windows/

      - name: Download macOS build artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: tandemonium-macos
          path: macos-artifact/

      - name: Unpack macOS app
        if: needs.build-macos.result == 'success'
        run: |
          mkdir -p builds/macos
          tar -C builds/macos -xzf macos-artifact/tandemonium-macos.tgz
          ls builds/macos

      # steamcmd runs natively on the runner. game-ci/steam-deploy's Docker
      # container started failing on 2026-10-23 before login ("Steamcmd needs to
      # be online to update"), so the upload is done by hand with the same
      # inputs: the saved login in STEAM_CONFIG_VDF and depot 4510251 (app + 1).
      # No continue-on-error: a failed upload (e.g. the saved Steam login
      # expiring, about every 2 weeks) must turn the run red.
      # Refresh it: steamcmd +login <user> (Steam Guard), then
      # base64 -w0 <steamcmd>/config/config.vdf | gh secret set STEAM_CONFIG_VDF
      - name: Install steamcmd
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 >/dev/null
          mkdir -p "$HOME/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar zxf - -C "$HOME/steamcmd"
          # First run self-updates steamcmd (retry: Valve's CDN can blip).
          for i in 1 2 3; do "$HOME/steamcmd/steamcmd.sh" +quit && break; sleep 10; done

      - name: Upload to Steam (Playtest)
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          # Push-triggered builds go to dev-private, NOT default. `default` is
          # the public branch real playtesters are on. Promoting a build to
          # default stays a deliberate act: dispatch this workflow and pick it,
          # or flip the live build in Steamworks.
          STEAM_BRANCH: ${{ inputs.steam_branch || 'dev-private' }}
          BUILD_DESC: 'Build ${{ github.sha }} from ${{ github.ref_name }}'
        run: |
          set -o pipefail
          mkdir -p "$HOME/steamcmd/config" "$HOME/Steam/config"
          echo "$STEAM_CONFIG_VDF" | base64 -d > "$HOME/steamcmd/config/config.vdf"
          cp "$HOME/steamcmd/config/config.vdf" "$HOME/Steam/config/config.vdf"
          VDF="$RUNNER_TEMP/app_build.vdf"
          MAC_DEPOT=""
          if [ -d builds/macos/Tandemonium.app ]; then
            MAC_DEPOT='"4510252" { "FileMapping" { "LocalPath" "./macos/*" "DepotPath" "." "recursive" "1" } }'
          fi
          cat > "$VDF" <<VDF
          "AppBuild"
          {
            "AppID" "4510250"
            "Desc" "$BUILD_DESC"
            "SetLive" "$STEAM_BRANCH"
            "ContentRoot" "$GITHUB_WORKSPACE/builds"
            "BuildOutput" "$RUNNER_TEMP/steam-output"
            "Depots"
            {
              "4510251"
              {
                "FileMapping"
                {
                  "LocalPath" "./windows/*"
                  "DepotPath" "."
                  "recursive" "1"
                }
              }
              $MAC_DEPOT
            }
          }
          VDF
          cat "$VDF"
          "$HOME/steamcmd/steamcmd.sh" +login "$STEAM_USERNAME" +run_app_build "$VDF" +quit | tee "$RUNNER_TEMP/steamcmd.log"
          # steamcmd can exit 0 on a failed login or build.
          grep -q "Successfully finished AppID 4510250 build" "$RUNNER_TEMP/steamcmd.log"
