name: Smokes

# Every headless smoke (docs/test-script.md PF-05), split into groups that run
# side by side, one Chrome per runner. pr-preview.yml's `tests` job still runs
# the unit tests and the fast lobby smokes; this is the full set, including the
# fake-controller smokes (disconnect, local-coop, versus, webhid, steam-input).
#
# When it runs (never automatically on a merge):
#   - from build-windows.yml before every Steam upload (workflow_call): the
#     upload job needs this to pass, so a red build never reaches Steam;
#   - on a PR only when it carries the `run-smokes` label (risky changes:
#     controllers, network). Plain PRs get pr-preview.yml's unit tests and
#     lobby smokes, a few minutes;
#   - by hand: Actions → Smokes → Run workflow, on main or any branch
#     (`gh workflow run smokes.yml --ref main`).
# A group's log is in its job; each smoke is a collapsible section, and the
# job summary has a pass/fail table.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
  workflow_dispatch:

concurrency:
  # github.workflow is the caller's name under workflow_call, so the Steam
  # gate and a hand-started run never cancel each other.
  group: smokes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smokes:
    name: smokes (${{ matrix.group }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-smokes')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lobby
            smokes: lobby boot edition ctas tutorial records seed daily ranked flows
          - group: ride
            smokes: ride crash helping-hand disruptions lookahead ping economy
          - group: ride-2
            smokes: achievements quality layout geese physics no-media controller-overlay
          - group: modes
            smokes: slingshot slingshot-aim tourist host-room grandma
          - group: controllers
            smokes: disconnect local-coop versus
          - group: controllers-2
            smokes: webhid steam-input
          - group: input
            smokes: input solo-extras
          - group: ui
            smokes: options lobby-layout
          - group: online
            smokes: online
          - group: phone
            smokes: phone-pad phone-coop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips Electron's and Puppeteer's postinstall downloads;
      # only Puppeteer's Chrome is needed, installed on the next line.
      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run smokes
        env:
          SMOKE_LOG_DIR: ${{ runner.temp }}/smoke-logs
          SMOKE_TIMEOUT_MS: '900000'
        run: node scripts/run-smokes.mjs ${{ matrix.smokes }}

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/smoke-logs
            /tmp/tandemonium-*
          if-no-files-found: ignore
          retention-days: 7
