name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage deploy files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
                   --exclude='out' --exclude='desktop' --exclude='electron' \
                   --exclude='scripts' --exclude='.env' \
                   ./ _site/
          # The overlay imports `../shared/...` relative to its src/js/ dir.
          # The web-deployed overlay (served via iframe from
          # /controller-overlay-web/) needs src/shared/ populated for those
          # imports to resolve. Copy shared/ directly into the staged _site
          # tree — pre-rsync population was unreliable in the previous
          # deploy.yml iteration.
          mkdir -p _site/controller-overlay/src/shared
          cp -r shared/* _site/controller-overlay/src/shared/
          # Strip dev-only .gitignore entries that would make git (inside
          # peaceiris/actions-gh-pages) refuse to stage src/shared/. Without
          # this, the files get cp'd into _site but never committed to
          # gh-pages (silent skip — no visible error), leaving the
          # web-deployed overlay's imports 404'd at runtime.
          rm -f _site/controller-overlay/.gitignore
          echo "Overlay shared/ contents in _site:"
          ls -R _site/controller-overlay/src/shared

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: 'pr-preview/**'
          cname: tandemonium.jimandi.love
