name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Own queue, NOT the gh-pages-write group the PR previews use. A concurrency
# group holds only one pending run, so sharing it let a burst of preview runs
# (e.g. closing PRs after a merge) evict the waiting main deploy — the Sept 8
# and Sept 22 deploys were silently cancelled that way. Here only a newer main
# deploy can replace a pending one. The cost: a preview may push to gh-pages at
# the same moment, so the deploy step below retries once. (#319)
concurrency:
  group: gh-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stamp the deployed commit + time into the lobby footer (#lobby-version)
      # so the live web build shows what's actually deployed. Mirrors the
      # PowerShell stamp step in build-windows.yml (which only covers desktop).
      - name: Stamp version in index.html
        run: |
          HASH=$(git rev-parse --short HEAD)
          DATE=$(TZ='America/New_York' date '+%m-%d-%Y %H:%M')
          VERSION="v.$HASH | $DATE"
          sed -i -E "s#id=\"lobby-version\">[^<]*#id=\"lobby-version\">${VERSION}#" index.html

      - name: Stage deploy files
        run: |
          mkdir -p _site
          # Exclude .gitignore: its `js/tourist-key.local.js` rule would make the
          # gh-pages `git add` skip the key file we inject below. Nothing it
          # ignores needs publishing — it's all already excluded here.
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' \
                   --exclude='node_modules' --exclude='out' --exclude='desktop' \
                   --exclude='electron' --exclude='scripts' --exclude='.env' \
                   ./ _site/
          # The 3D controller overlay is no longer part of this repo — it lives
          # in UsersFirst/tandemonium-controller-lab and is served at
          # https://lab.usersfirst.games/overlay (the /test card links out to it).

      # Tourist Mode (#333) reads window.__TOURIST_MAPS_KEY__ from the gitignored
      # js/tourist-key.local.js (generated locally by `npm run gen-tourist-key`).
      # That file never enters git, so recreate it here from the GOOGLE_MAPS_API_KEY
      # secret — mirrors scripts/gen-tourist-key.js. The Map Tiles key is client-
      # side by design; keep it locked to the tandemonium.jimandi.love referrer +
      # Map Tiles API in Google Cloud so publishing it here is safe.
      - name: Inject Tourist Maps key
        env:
          TOURIST_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          node -e 'require("fs").writeFileSync("_site/js/tourist-key.local.js", "window.__TOURIST_MAPS_KEY__ = " + JSON.stringify(process.env.TOURIST_MAPS_KEY || "") + ";\n")'

      # Carry the existing PR previews into the publish tree so this deploy
      # can't drop them. `keep_files: true` alone has proven unreliable at
      # preserving the pr-preview/ subtree, so we restore it explicitly: the
      # previews become part of _site and are therefore always re-published.
      # (#319)
      - name: Preserve existing PR previews
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git ls-tree -d origin/gh-pages pr-preview 2>/dev/null | grep -q pr-preview; then
            # `if` consumes the pipeline status, so a failure here can't abort
            # the deploy (bash -eo pipefail) — worst case previews aren't kept.
            if git archive origin/gh-pages pr-preview | tar -x -C _site; then
              echo "Preserved PR previews: $(ls _site/pr-preview 2>/dev/null | tr '\n' ' ')"
            else
              echo "WARNING: failed to preserve pr-preview; continuing deploy"
            fi
          else
            echo "No existing PR previews to preserve"
          fi

      - name: Deploy to gh-pages branch
        id: deploy
        # A preview push landing mid-deploy rejects this one (non-fast-forward).
        # Don't fail yet — the retry below re-reads gh-pages and tries again.
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # No exclude_assets for pr-preview: we now restore it INTO _site (see
          # the preserve step), so it must be published rather than excluded.
          keep_files: true
          cname: tandemonium.jimandi.love

      # Re-read the previews after the racing preview push so the retry
      # republishes its new pr-preview/ content instead of reverting it.
      - name: Refresh PR previews for retry
        if: steps.deploy.outcome == 'failure'
        run: |
          sleep 20
          rm -rf _site/pr-preview
          git fetch origin gh-pages --depth=1 || true
          if git ls-tree -d origin/gh-pages pr-preview 2>/dev/null | grep -q pr-preview; then
            git archive origin/gh-pages pr-preview | tar -x -C _site || echo "WARNING: failed to preserve pr-preview"
          fi

      - name: Deploy to gh-pages branch (retry)
        if: steps.deploy.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          cname: tandemonium.jimandi.love
