name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stamp the deployed commit + time into the lobby footer (#lobby-version)
      # so the live web build shows what's actually deployed. Mirrors the
      # PowerShell stamp step in build-windows.yml (which only covers desktop).
      - name: Stamp version in index.html
        run: |
          HASH=$(git rev-parse --short HEAD)
          DATE=$(TZ='America/New_York' date '+%m-%d-%Y %H:%M')
          VERSION="v.$HASH | $DATE"
          sed -i -E "s#id=\"lobby-version\">[^<]*#id=\"lobby-version\">${VERSION}#" index.html

      - name: Stage deploy files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
                   --exclude='out' --exclude='desktop' --exclude='electron' \
                   --exclude='scripts' --exclude='.env' \
                   ./ _site/
          # The 3D controller overlay is no longer part of this repo — it lives
          # in UsersFirst/tandemonium-controller-lab and is served at
          # https://lab.usersfirst.games/overlay (the /test card links out to it).

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: 'pr-preview/**'
          cname: tandemonium.jimandi.love
