<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tandemonium Phone Pad</title>
<link rel="stylesheet" href="../shared/ui/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--uf-color-bg, #0b0d12); color: var(--uf-color-fg, #fff);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  .screen { display: none; position: fixed; inset: 0; }
  .screen.on { display: flex; }

  /* Connect / bad link */
  .center {
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
  }
  .center h1 { font-size: 26px; letter-spacing: 1px; }
  .center p { color: var(--uf-color-fg-muted, #8a93a6); font-size: 16px; line-height: 1.5; max-width: 420px; }
  #btn-connect {
    font: inherit; font-size: 22px; font-weight: bold; letter-spacing: 1px;
    padding: 18px 40px; border-radius: 14px; cursor: pointer;
    color: var(--uf-color-fg-on-accent, #06140c); background: var(--uf-color-accent, #44ff66);
    border: none;
  }
  .seat { color: var(--uf-color-accent-2, #ffd23f); font-weight: bold; }

  /* One fixed layout, riding or in menus (the game decides what a press
     means): a gamepad-style top (a plus-shaped D-pad on the left with the
     House Tandem logo, status + Pause / Recenter in the middle, OK / BACK on
     the right) over the two pedals. */
  #screen-ride { flex-direction: column; --cell: clamp(36px, 12vh, 46px); }
  #controls {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
  }
  .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .side.middle { align-items: center; }
  .dpad { justify-self: start; }
  .side.right { align-items: flex-end; }
  .side .row { display: flex; gap: 8px; }
  #status {
    max-width: 100%; font-size: 13px; color: var(--uf-color-fg-muted, #8a93a6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.ok { color: var(--uf-color-accent, #44ff66); }

  /* Buttons: held while touched; the game reads the menu ones only in menus
     (Pause and Recenter work any time). */
  .nav-btn {
    -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
    font: inherit; font-size: 20px; font-weight: bold; border-radius: 14px;
    min-width: 54px; height: var(--cell); padding: 0 12px;
    color: var(--uf-color-fg, #fff); background: var(--uf-color-surface-2, rgba(255,255,255,.1));
    border: 2px solid var(--uf-color-line-soft, rgba(255,255,255,.16));
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  .nav-btn.down { background: var(--uf-color-accent-soft, rgba(60,200,80,.25)); border-color: var(--uf-color-accent, #44ff66); }
  .nav-btn[data-nav="ok"] { min-width: 96px;
    color: var(--uf-color-fg-on-accent, #06140c); background: var(--uf-color-accent, #44ff66); border-color: var(--uf-color-accent, #44ff66); }
  .nav-btn[data-nav="ok"].down { filter: brightness(.8); }
  .nav-btn[data-nav="back"] { min-width: 96px; font-size: 16px; }
  .nav-btn[data-nav="pause"] { font-size: 17px; }
  .nav-btn[data-nav="recenter"] { font-size: 24px; }

  /* The D-pad: one plus-shaped piece, arrows on the arms, logo in the hub. */
  .dpad {
    display: grid; grid-template-columns: var(--cell) calc(var(--cell) * 1.35) var(--cell);
    grid-template-rows: repeat(3, var(--cell));
    filter: drop-shadow(0 0 1px rgba(255,255,255,.35)) drop-shadow(0 2px 6px rgba(0,0,0,.6));
  }
  .dpad > * { background: #2a2e38; border: none; }
  /* Arrows are one drawn triangle, turned per arm: text arrows (◀ ▶) show as
     colour emoji on some phones. */
  .dpad .arm {
    -webkit-appearance: none; appearance: none; padding: 0; margin: 0;
    color: var(--uf-color-fg-muted, #c3cad8);
    display: flex; align-items: center; justify-content: center; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad .arm svg { width: 38%; height: 38%; fill: currentColor; pointer-events: none; }
  .dpad [data-nav="left"] svg  { transform: rotate(-90deg); }
  .dpad [data-nav="right"] svg { transform: rotate(90deg); }
  .dpad [data-nav="down"] svg  { transform: rotate(180deg); }
  .dpad .arm.down { background: var(--uf-color-accent-soft, #2f6b3a); color: var(--uf-color-fg, #fff); }
  .dpad [data-nav="up"]    { grid-area: 1 / 2; border-radius: 10px 10px 0 0; }
  .dpad [data-nav="left"]  { grid-area: 2 / 1; border-radius: 10px 0 0 10px; }
  .dpad .hub               { grid-area: 2 / 2; display: flex; align-items: center; justify-content: center; }
  .dpad [data-nav="right"] { grid-area: 2 / 3; border-radius: 0 10px 10px 0; }
  .dpad [data-nav="down"]  { grid-area: 3 / 2; border-radius: 0 0 10px 10px; }
  .dpad .hub img { width: 90%; height: 80%; object-fit: contain; pointer-events: none; }

  /* Pedals: the game's pedal art, a little shorter than before. */
  #pedals { flex: 1; min-height: 0; display: flex; gap: 6px; padding: 0 6px max(6px, env(safe-area-inset-bottom)); }
  .pedal {
    flex: 1; min-height: 0; overflow: hidden; padding: 8px 8px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 18px; font-size: 16px; font-weight: bold; letter-spacing: 2px;
    background: var(--uf-color-surface-3, rgba(255,255,255,.04));
    border: 2px solid var(--uf-color-line-soft, rgba(255,255,255,.16));
    color: var(--uf-color-fg-muted, #8a93a6);
    transition: background .05s;
  }
  .pedal img {
    flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain;
    pointer-events: none; -webkit-user-drag: none; transition: transform .05s;
  }
  .pedal.down {
    background: var(--uf-color-accent-soft, rgba(60,200,80,.25));
    border-color: var(--uf-color-accent, #44ff66); color: var(--uf-color-fg, #fff);
  }
  .pedal.down img { transform: scale(.94); }
  #motion-note { color: var(--uf-color-warn, #ffd23f); font-size: 13px; padding: 0 14px 6px; }
  #motion-note:empty { display: none; }

  /* Portrait: ask to turn sideways (D3: hold it like handlebars) */
  #rotate { display: none; position: fixed; inset: 0; z-index: 5; background: var(--uf-color-bg, #0b0d12);
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #rotate .phone { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) {
    body.riding #rotate { display: flex; }
  }
</style>
</head>
<body>
  <section class="screen center" id="screen-connect">
    <h1>TANDEMONIUM</h1>
    <p>Your phone is the controller for <span class="seat" id="seat-label">Player 1</span>.</p>
    <p>Hold it sideways like handlebars. <strong>Tilt</strong> to steer, tap <strong>LEFT</strong> and <strong>RIGHT</strong> to pedal.</p>
    <button id="btn-connect" type="button">CONNECT</button>
  </section>

  <section class="screen center" id="screen-bad-link">
    <h1>Link expired</h1>
    <p>Scan the QR code on the game screen again.</p>
  </section>

  <section class="screen" id="screen-ride">
    <div id="controls">
      <div class="dpad">
        <button class="arm" data-nav="up" type="button" aria-label="Up"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8.5H1z"/></svg></button>
        <button class="arm" data-nav="left" type="button" aria-label="Left"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8.5H1z"/></svg></button>
        <div class="hub"><img src="img/housetandem-controller.svg" alt="House Tandem" draggable="false"></div>
        <button class="arm" data-nav="right" type="button" aria-label="Right"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8.5H1z"/></svg></button>
        <button class="arm" data-nav="down" type="button" aria-label="Down"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8.5H1z"/></svg></button>
      </div>
      <div class="side middle">
        <span id="status">Connecting…</span>
        <div class="row">
          <button class="nav-btn" id="btn-pause" data-nav="pause" type="button" aria-label="Pause">&#10074;&#10074;</button>
          <button class="nav-btn" id="btn-recenter" data-nav="recenter" type="button" aria-label="Calibrate steering">&#127919;</button>
        </div>
      </div>
      <div class="side right">
        <button class="nav-btn" data-nav="ok" type="button">OK</button>
        <button class="nav-btn" data-nav="back" type="button">BACK</button>
      </div>
    </div>
    <div id="motion-note"></div>
    <div id="pedals">
      <div class="pedal" id="pedal-l"><img src="img/pedal_left.webp" alt="" draggable="false">LEFT</div>
      <div class="pedal" id="pedal-r"><img src="img/pedal_right.webp" alt="" draggable="false">RIGHT</div>
    </div>
  </section>

  <div id="rotate">
    <div class="phone">&#128241;</div>
    <p>Turn your phone sideways, like handlebars.</p>
  </div>

  <script>
    // Portrait hint only once riding (the connect screen reads fine upright).
    new MutationObserver(() => {
      document.body.classList.toggle('riding', document.getElementById('screen-ride').classList.contains('on'));
    }).observe(document.getElementById('screen-ride'), { attributes: true });
  </script>
  <script type="module" src="../js/remote/phone-pad.js"></script>
</body>
</html>
