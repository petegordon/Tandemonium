<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualSense Touchpad Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #111; font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #eee;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: rgba(0,0,0,0.92);
    z-index: 100; transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay p { color: #aaa; font-size: 20px; text-align: center; line-height: 1.6; }
  #overlay p strong { color: #fff; }
  #overlay .note { font-size: 13px; color: #666; }

  #connect-btn {
    background: #2a2a3a; color: #4af; border: 1.5px solid #4af;
    padding: 14px 28px; border-radius: 8px;
    font-size: 16px; cursor: pointer; font-family: inherit;
  }
  #connect-btn:hover { background: #2a3a4a; }

  .hud {
    position: fixed; font-size: 13px; color: #888; z-index: 10;
    pointer-events: none; font-family: monospace;
  }
  .hud .value { color: #0f0; }
  .hud .conn { color: #f0a; }
  .hud .t0-color { color: #44aaff; }
  .hud .t1-color { color: #ff44aa; }
  .hud .touch-inactive { color: #444; }

  #status-hud { top: 16px; left: 16px; }

  #touch-hud {
    bottom: 16px; left: 50%; transform: translateX(-50%);
    text-align: center; line-height: 1.8;
  }

  #debug-hud {
    top: 16px; right: 16px; text-align: right;
    font-size: 11px; color: #666; line-height: 1.6;
    pointer-events: auto;
  }
  #debug-hud .hex { color: #ff0; }
  #debug-hud .parsed { color: #4af; }
  #debug-hud .offset-label { color: #888; }

  .toolbar {
    position: fixed; bottom: 80px; right: 16px; z-index: 10;
    display: flex; gap: 8px;
  }
  .toolbar button {
    background: #2a2a2a; color: #aaa; border: 1px solid #444;
    padding: 8px 14px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .toolbar button:hover { background: #333; }
  .toolbar button.danger { color: #f44; border-color: #f44; }
</style>
</head>
<body>

<div id="overlay">
  <p><strong>DualSense Touchpad Draw</strong></p>
  <button id="connect-btn">Connect DualSense (WebHID)</button>
  <p class="note">Requires Chrome/Edge with WebHID support.<br>
  Draw with 1 or 2 fingers. Each finger gets its own color.<br>
  Click touchpad to cycle colors. Max 2 touch points.</p>
</div>

<div id="status-hud" class="hud">
  <div>Device: <span id="device-name" class="value">--</span></div>
  <div>Connection: <span id="conn-type" class="conn">--</span></div>
  <div style="margin-top:4px; color:#555">Touchpad: 1920 x 1080 &middot; 2 touch points</div>
</div>

<div id="debug-hud" class="hud">
  <div id="raw-bytes"></div>
</div>

<div class="toolbar">
  <button id="clear-btn" class="danger">Clear</button>
</div>

<div id="touch-hud" class="hud">
  <div>Touch 0: <span id="t0-info" class="touch-inactive">inactive</span></div>
  <div>Touch 1: <span id="t1-info" class="touch-inactive">inactive</span></div>
  <div id="btn-info" style="margin-top:2px">Click: <span class="touch-inactive">--</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── Constants ──
const VENDOR_ID_SONY = 0x054c;
const PRODUCT_IDS = [0x0ce6, 0x0df2];
const TOUCHPAD_W = 1920;
const TOUCHPAD_H = 1080;

const SURFACE_W = 10;
const SURFACE_H = SURFACE_W / (TOUCHPAD_W / TOUCHPAD_H);

// ── Three.js ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x111111);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camH = SURFACE_H / 2 + 1.5;
const camW = camH * (window.innerWidth / window.innerHeight);
const camera = new THREE.OrthographicCamera(-camW, camW, camH, -camH, 0.1, 100);
camera.position.set(0, 10, 0);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x666666));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(2, 10, 3);
scene.add(dirLight);

// Drawing surface
const surfaceMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2a, roughness: 0.9 });
const surface = new THREE.Mesh(new THREE.PlaneGeometry(SURFACE_W, SURFACE_H), surfaceMat);
surface.rotation.x = -Math.PI / 2;
scene.add(surface);

// Border
const borderMat = new THREE.LineBasicMaterial({ color: 0x444466 });
const border = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.PlaneGeometry(SURFACE_W + 0.05, SURFACE_H + 0.05)),
  borderMat
);
border.rotation.x = -Math.PI / 2;
border.position.y = 0.001;
scene.add(border);

// Grid
const gridMat = new THREE.LineBasicMaterial({ color: 0x222244, transparent: true, opacity: 0.5 });
for (let i = 1; i < 10; i++) {
  const t = i / 10;
  const vGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-SURFACE_W/2 + t*SURFACE_W, 0.002, -SURFACE_H/2),
    new THREE.Vector3(-SURFACE_W/2 + t*SURFACE_W, 0.002, SURFACE_H/2)
  ]);
  scene.add(new THREE.Line(vGeo, gridMat));
  const hGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-SURFACE_W/2, 0.002, -SURFACE_H/2 + t*SURFACE_H),
    new THREE.Vector3(SURFACE_W/2, 0.002, -SURFACE_H/2 + t*SURFACE_H)
  ]);
  scene.add(new THREE.Line(hGeo, gridMat));
}

// ── Touch indicators — one per finger ──
// Finger 0 = blue, Finger 1 = pink
const FINGER_COLORS = [0x44aaff, 0xff44aa];

// Glow texture (shared)
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 64; glowCanvas.height = 64;
const glowCtx = glowCanvas.getContext('2d');
const grad = glowCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(255,255,255,0.8)');
grad.addColorStop(0.4, 'rgba(255,255,255,0.2)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
glowCtx.fillStyle = grad;
glowCtx.fillRect(0, 0, 64, 64);
const glowTex = new THREE.CanvasTexture(glowCanvas);

const touchSpheres = [];
const touchRings = [];
const glowSprites = [];

for (let i = 0; i < 2; i++) {
  const color = FINGER_COLORS[i];

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 24, 24),
    new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: 0.3,
      metalness: 0.2, roughness: 0.3
    })
  );
  sphere.visible = false;
  scene.add(sphere);
  touchSpheres.push(sphere);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.2, 0.28, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.003;
  ring.visible = false;
  scene.add(ring);
  touchRings.push(ring);

  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending
  }));
  sprite.scale.set(0.8, 0.8, 1);
  sprite.visible = false;
  scene.add(sprite);
  glowSprites.push(sprite);
}

// ── Strokes ──
const strokeGroup = new THREE.Group();
scene.add(strokeGroup);

// Color palette — touchpad click picks random pair, never the same for both fingers
const PALETTE = [0x44aaff, 0xff44aa, 0x44ff88, 0xffaa44, 0xff4444, 0xaa44ff, 0xffffff];
const fingerColors = [0x44aaff, 0xff44aa]; // current color per finger

function randomizeColors() {
  const i0 = Math.floor(Math.random() * PALETTE.length);
  let i1 = Math.floor(Math.random() * (PALETTE.length - 1));
  if (i1 >= i0) i1++; // ensure different
  fingerColors[0] = PALETTE[i0];
  fingerColors[1] = PALETTE[i1];
}

// Per-slot stroke state — track by ID to detect slot swaps
const activeStrokes = [null, null];
const prevActive = [false, false];
const prevTrackingId = [-1, -1];

function touchToWorld(tx, ty) {
  return new THREE.Vector3(
    (tx / TOUCHPAD_W - 0.5) * SURFACE_W,
    0.01,
    (ty / TOUCHPAD_H - 0.5) * SURFACE_H
  );
}

function buildStrokeMesh(points, color, width) {
  if (points.length < 2) return null;
  const positions = [];
  const indices = [];

  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    let dir;
    if (i === 0) dir = new THREE.Vector3().subVectors(points[1], points[0]).normalize();
    else if (i === points.length - 1) dir = new THREE.Vector3().subVectors(points[i], points[i-1]).normalize();
    else dir = new THREE.Vector3().subVectors(points[i+1], points[i-1]).normalize();

    const perp = new THREE.Vector3(-dir.z, 0, dir.x);
    const hw = width * 0.5;
    positions.push(p.x - perp.x*hw, p.y, p.z - perp.z*hw);
    positions.push(p.x + perp.x*hw, p.y, p.z + perp.z*hw);

    if (i > 0) {
      const vi = (i-1) * 2;
      indices.push(vi, vi+1, vi+2, vi+1, vi+3, vi+2);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.15,
    roughness: 0.6, metalness: 0.1, side: THREE.DoubleSide
  }));
}

function updateLiveStroke(idx) {
  const stroke = activeStrokes[idx];
  if (!stroke || stroke.points.length < 2) return;
  if (stroke.mesh) strokeGroup.remove(stroke.mesh);
  const mesh = buildStrokeMesh(stroke.points, stroke.color, stroke.width);
  if (mesh) { strokeGroup.add(mesh); stroke.mesh = mesh; }
}

function finalizeStroke(idx) {
  const stroke = activeStrokes[idx];
  if (!stroke || stroke.points.length < 2) { activeStrokes[idx] = null; return; }
  if (stroke.mesh) strokeGroup.remove(stroke.mesh);
  const mesh = buildStrokeMesh(stroke.points, stroke.color, stroke.width);
  if (mesh) strokeGroup.add(mesh);
  activeStrokes[idx] = null;
}

// ── WebHID ──
let hidDevice = null;
let connectionType = null;

const touches = [
  { active: false, x: 0, y: 0, id: 0 },
  { active: false, x: 0, y: 0, id: 0 }
];
let touchpadButton = false;
let prevTouchpadButton = false;

let debugBytes = '';

function detectConnectionType(device) {
  for (const col of device.collections) {
    if (col.outputReports) {
      for (const report of col.outputReports) {
        if (report.reportId === 0x31) return 'bluetooth';
      }
    }
  }
  return 'usb';
}

function hex(val) { return val.toString(16).toUpperCase().padStart(2, '0'); }

function parseTouchPoint(data, offset) {
  if (offset + 4 > data.byteLength) return { active: false, id: 0, x: 0, y: 0 };
  const b0 = data.getUint8(offset);
  const b1 = data.getUint8(offset + 1);
  const b2 = data.getUint8(offset + 2);
  const b3 = data.getUint8(offset + 3);
  return {
    active: !(b0 & 0x80),
    id: b0 & 0x7F,
    x: b1 | ((b2 & 0x0F) << 8),
    y: ((b2 & 0xF0) >> 4) | (b3 << 4)
  };
}

function handleInputReport(event) {
  const data = event.data;
  const reportId = event.reportId;

  if (connectionType === 'usb' && reportId !== 0x01) return;
  if (connectionType === 'bluetooth' && reportId !== 0x31) return;

  // Touch offsets: USB touch0 @ 32, touch1 @ 36. BT touch0 @ 33, touch1 @ 37.
  const baseOffset = connectionType === 'usb' ? 32 : 33;

  const t0 = parseTouchPoint(data, baseOffset);
  const t1 = parseTouchPoint(data, baseOffset + 4);

  touches[0].active = t0.active;
  touches[0].x = t0.x;
  touches[0].y = t0.y;
  touches[0].id = t0.id;

  touches[1].active = t1.active;
  touches[1].x = t1.x;
  touches[1].y = t1.y;
  touches[1].id = t1.id;

  // Debug hex dump
  const dumpStart = baseOffset;
  const dumpEnd = Math.min(data.byteLength, baseOffset + 8);
  let hexDump = '';
  for (let i = dumpStart; i < dumpEnd; i++) {
    hexDump += '<span class="offset-label">[' + i + ']</span><span class="hex">' + hex(data.getUint8(i)) + '</span> ';
  }
  debugBytes =
    '<div style="color:#888">Touch bytes:</div><div>' + hexDump + '</div>' +
    '<div style="margin-top:4px" class="parsed">T0: ' + (t0.active ? 'ACTIVE' : 'off') + ' id:' + t0.id + ' X:' + t0.x + ' Y:' + t0.y + '</div>' +
    '<div class="parsed">T1: ' + (t1.active ? 'ACTIVE' : 'off') + ' id:' + t1.id + ' X:' + t1.x + ' Y:' + t1.y + '</div>';

  // Touchpad button
  if (connectionType === 'usb') {
    touchpadButton = !!(data.getUint8(9) & 0x02);
  } else {
    touchpadButton = !!(data.getUint8(10) & 0x02);
  }

  if (touchpadButton && !prevTouchpadButton) {
    randomizeColors();
  }
  prevTouchpadButton = touchpadButton;

  // Dual-touch stroke drawing — track by ID to detect slot swaps
  for (let i = 0; i < 2; i++) {
    const t = touches[i];
    const idChanged = t.active && prevActive[i] && t.id !== prevTrackingId[i];

    if (idChanged) {
      // Tracking ID changed while slot stayed active = slot swap
      // Finalize the old stroke, start a new one at the new position
      updateLiveStroke(i);
      finalizeStroke(i);
      const wp = touchToWorld(t.x, t.y);
      activeStrokes[i] = { points: [wp], color: fingerColors[i], width: 0.06, mesh: null };
    } else if (t.active) {
      const wp = touchToWorld(t.x, t.y);

      if (!prevActive[i]) {
        // New touch — lock in the current finger color for this stroke
        activeStrokes[i] = { points: [wp], color: fingerColors[i], width: 0.06, mesh: null };
      } else if (activeStrokes[i]) {
        const last = activeStrokes[i].points[activeStrokes[i].points.length - 1];
        const dist = wp.distanceTo(last);
        if (dist > 0.02) {
          activeStrokes[i].points.push(wp);
          if (activeStrokes[i].points.length % 3 === 0) updateLiveStroke(i);
        }
      }
    } else if (prevActive[i]) {
      // Finger lifted — finalize
      updateLiveStroke(i);
      finalizeStroke(i);
    }

    prevActive[i] = t.active;
    prevTrackingId[i] = t.id;
  }
}

async function connect() {
  try {
    const filters = PRODUCT_IDS.map(productId => ({
      vendorId: VENDOR_ID_SONY, productId,
      usagePage: 0x0001, usage: 0x0005
    }));
    const devices = await navigator.hid.requestDevice({ filters });
    if (!devices || devices.length === 0) return;

    hidDevice = devices[0];
    if (!hidDevice.opened) await hidDevice.open();
    connectionType = detectConnectionType(hidDevice);

    document.getElementById('device-name').textContent = hidDevice.productName;
    document.getElementById('conn-type').textContent = connectionType.toUpperCase();
    hidDevice.addEventListener('inputreport', handleInputReport);
    document.getElementById('overlay').classList.add('hidden');
  } catch (err) {
    console.error('WebHID error:', err);
  }
}

document.getElementById('connect-btn').addEventListener('click', connect);

document.getElementById('clear-btn').addEventListener('click', () => {
  while (strokeGroup.children.length > 0) {
    const child = strokeGroup.children[0];
    strokeGroup.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  }
  activeStrokes[0] = null;
  activeStrokes[1] = null;
});

// ── Animation ──
function animate() {
  requestAnimationFrame(animate);

  for (let i = 0; i < 2; i++) {
    const t = touches[i];
    if (t.active) {
      const wp = touchToWorld(t.x, t.y);
      touchSpheres[i].visible = true;
      touchSpheres[i].position.set(wp.x, 0.15, wp.z);
      touchRings[i].visible = true;
      touchRings[i].position.set(wp.x, 0.003, wp.z);
      const pulse = 1 + Math.sin(performance.now() * 0.006 + i * 2) * 0.15;
      touchRings[i].scale.set(pulse, pulse, 1);
      glowSprites[i].visible = true;
      glowSprites[i].position.set(wp.x, 0.05, wp.z);
    } else {
      touchSpheres[i].visible = false;
      touchRings[i].visible = false;
      glowSprites[i].visible = false;
    }
  }

  if (touchpadButton) {
    borderMat.color.setHex(0xffff44);
    surfaceMat.emissive.setHex(0x111100);
    surfaceMat.emissiveIntensity = 0.3;
  } else {
    borderMat.color.setHex(0x444466);
    surfaceMat.emissive.setHex(0x000000);
    surfaceMat.emissiveIntensity = 0;
  }

  // HUD
  for (let i = 0; i < 2; i++) {
    const el = document.getElementById('t' + i + '-info');
    const css = 't' + i + '-color';
    if (touches[i].active) {
      el.innerHTML = '<span class="' + css + '">CONTACT</span>' +
        ' &nbsp; X:<span class="' + css + '">' + touches[i].x + '</span>' +
        ' &nbsp; Y:<span class="' + css + '">' + touches[i].y + '</span>' +
        ' &nbsp; ID:<span class="' + css + '">' + touches[i].id + '</span>';
    } else {
      el.innerHTML = '<span class="touch-inactive">no contact</span>';
    }
  }

  const btnEl = document.getElementById('btn-info');
  const c0Hex = '#' + fingerColors[0].toString(16).padStart(6, '0');
  const c1Hex = '#' + fingerColors[1].toString(16).padStart(6, '0');
  btnEl.innerHTML = 'Button: ' +
    (touchpadButton ? '<span class="t0-color">PRESSED</span>' : '<span class="touch-inactive">released</span>') +
    ' &nbsp; F0: <span style="color:' + c0Hex + '">\u2588\u2588</span>' +
    ' &nbsp; F1: <span style="color:' + c1Hex + '">\u2588\u2588</span>' +
    ' &nbsp; <span class="touch-inactive">(click to randomize)</span>';

  document.getElementById('raw-bytes').innerHTML = debugBytes;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  const aspect = window.innerWidth / window.innerHeight;
  const h = SURFACE_H / 2 + 1.5;
  const w = h * aspect;
  camera.left = -w; camera.right = w;
  camera.top = h; camera.bottom = -h;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
