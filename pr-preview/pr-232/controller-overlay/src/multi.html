<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Controller Overlay (Prototype)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b0d12;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #eee;
    user-select: none;
  }

  #drag-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 36px;
    -webkit-app-region: drag;
    z-index: 100;
  }

  #app-title {
    position: fixed;
    top: 10px; left: 16px;
    font-size: 12px;
    letter-spacing: 1.2px;
    color: #6a7184;
    text-transform: uppercase;
    z-index: 101;
    -webkit-app-region: no-drag;
    pointer-events: none;
  }

  #slots {
    position: absolute;
    top: 36px; left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 12px;
    padding: 16px;
  }

  .slot {
    flex: 1 1 0;
    position: relative;
    background: linear-gradient(180deg, rgba(30,34,44,0.65) 0%, rgba(18,21,28,0.65) 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.25s, box-shadow 0.25s, opacity 0.25s;
  }
  .slot.claimed.p1 {
    border-color: rgba(80,150,255,0.45);
    box-shadow: 0 0 30px rgba(40,110,220,0.18) inset;
  }
  .slot.claimed.p2 {
    border-color: rgba(255,90,90,0.45);
    box-shadow: 0 0 30px rgba(220,60,60,0.18) inset;
  }
  .slot.empty { opacity: 0.75; }

  .slot-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 18px 0 18px;
  }
  .slot-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #7d8aa0;
    text-transform: uppercase;
  }
  .slot.claimed.p1 .slot-title { color: #6ea8ff; }
  .slot.claimed.p2 .slot-title { color: #ff7a7a; }

  .slot-sub {
    font-size: 9px;
    color: #4e5564;
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1 1 auto;
    min-width: 0;
    text-align: right;
    margin-left: 10px;
  }

  .slot-canvas-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slot-canvas-wrap canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  .slot.empty .slot-canvas-wrap canvas { filter: grayscale(1) brightness(0.45); opacity: 0.55; }

  .slot-footer {
    padding: 10px 18px 16px 18px;
    text-align: center;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slot-prompt {
    font-size: 13px;
    letter-spacing: 0.4px;
    color: #aab3c5;
  }
  .slot.claimed .slot-prompt { color: #e4ebf7; }
  .slot-hint {
    font-size: 10px;
    color: #5b6374;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  .slot-prompt .pulse {
    display: inline-block;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1.0; }
  }

  /* Release ring: sits in the center of the slot, radial sweep via conic-gradient */
  .release-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 96px; height: 96px;
    margin: -48px 0 0 -48px;
    border-radius: 50%;
    background: conic-gradient(rgba(255,90,90,0.85) calc(var(--p, 0) * 1%), rgba(255,255,255,0.08) 0);
    mask: radial-gradient(closest-side, transparent 72%, #000 74%);
    -webkit-mask: radial-gradient(closest-side, transparent 72%, #000 74%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .release-ring.visible { opacity: 1; }
  .release-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10px;
    letter-spacing: 1.2px;
    color: #ffb0b0;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .release-ring.visible + .release-label { opacity: 1; }

  .slot-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }
  .slot-btn {
    background: rgba(255,255,255,0.06);
    color: #cfd5e2;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 11px;
    letter-spacing: 0.4px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .slot-btn:hover { background: rgba(255,255,255,0.12); }
  /* When a slot-btn is marked .status, it's read-only and styled as a badge
     rather than a clickable button. Used when gyro/HID is already bound. */
  .slot-btn.status {
    cursor: default;
    pointer-events: none;
    background: transparent;
    border: 1px solid rgba(120,210,160,0.35);
    color: #8be0a8;
    font-size: 10px;
    padding: 3px 9px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .slot-btn.status::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: #5fd184;
    box-shadow: 0 0 6px rgba(95,209,132,0.7);
    vertical-align: middle;
  }
  .hid-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 9px;
    font-family: monospace;
    background: rgba(100,200,140,0.2);
    color: #8ae0a8;
  }

  .slot-diag {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(120,180,255,0.18);
    border-radius: 6px;
    font: 10px/1.45 ui-monospace, 'Cascadia Mono', Menlo, monospace;
    color: #9fb4d6;
    text-align: left;
    white-space: pre-wrap;
    max-height: 180px;
    overflow: auto;
  }
  .slot-diag[hidden] { display: none; }
  .slot-diag .k { color: #6b7a93; }
  .slot-diag .v { color: #d7e3f7; }
  .slot-diag .warn { color: #ffb257; }
  .slot-diag .ok { color: #8be0a8; }

  #status-line {
    position: fixed;
    bottom: 6px; left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    color: #4b5160;
    letter-spacing: 0.6px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="drag-bar"></div>
<div id="app-title">Tandemonium · Multi-Controller Prototype</div>

<div id="slots">
  <div class="slot empty" data-slot="P1">
    <div class="slot-header">
      <div class="slot-title">Player 1</div>
      <div class="slot-sub" data-role="sub"></div>
    </div>
    <div class="slot-canvas-wrap">
      <canvas data-role="canvas"></canvas>
      <div class="release-ring" data-role="ring"></div>
      <div class="release-label">Release</div>
    </div>
    <div class="slot-footer">
      <div>
        <div class="slot-prompt" data-role="prompt"><span class="pulse">Press any button to join</span></div>
        <div class="slot-hint" data-role="hint"></div>
        <div class="slot-actions">
          <button class="slot-btn" data-role="connect-hid">Connect Gyro (WebHID)</button>
          <button class="slot-btn" data-role="calibrate" style="display:none;">Recalibrate Gyro</button>
          <button class="slot-btn" data-role="diag-toggle">Diagnostics</button>
        </div>
        <div class="slot-diag" data-role="diag" hidden></div>
      </div>
    </div>
  </div>

  <div class="slot empty" data-slot="P2">
    <div class="slot-header">
      <div class="slot-title">Player 2</div>
      <div class="slot-sub" data-role="sub"></div>
    </div>
    <div class="slot-canvas-wrap">
      <canvas data-role="canvas"></canvas>
      <div class="release-ring" data-role="ring"></div>
      <div class="release-label">Release</div>
    </div>
    <div class="slot-footer">
      <div>
        <div class="slot-prompt" data-role="prompt"><span class="pulse">Press any button to join</span></div>
        <div class="slot-hint" data-role="hint"></div>
        <div class="slot-actions">
          <button class="slot-btn" data-role="connect-hid">Connect Gyro (WebHID)</button>
          <button class="slot-btn" data-role="calibrate" style="display:none;">Recalibrate Gyro</button>
          <button class="slot-btn" data-role="diag-toggle">Diagnostics</button>
        </div>
        <div class="slot-diag" data-role="diag" hidden></div>
      </div>
    </div>
  </div>
</div>

<div id="status-line">Hold PS/Home 2s to release a slot · First input claims P1, second distinct device claims P2</div>

<button id="debug-toggle" title="Toggle debug readout">&#x25BE; Debug</button>
<div id="debug-readout" class="hidden"></div>
<style>
  #debug-toggle {
    position: fixed;
    top: 6px;
    right: 10px;
    z-index: 210;
    background: rgba(255,255,255,0.06);
    color: #9aa3b4;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 10px;
    letter-spacing: 0.6px;
    cursor: pointer;
    -webkit-app-region: no-drag;
    font-family: inherit;
  }
  #debug-toggle:hover { background: rgba(255,255,255,0.12); color: #e0e6f0; }
  #debug-toggle.open { background: rgba(80,150,255,0.2); color: #cfe0ff; border-color: rgba(80,150,255,0.4); }
  #debug-readout {
    position: fixed;
    top: 36px;
    right: 10px;
    max-width: min(640px, 70vw);
    max-height: 60vh;
    overflow: auto;
    font: 10px/1.4 ui-monospace, 'Cascadia Mono', Menlo, monospace;
    color: #8af;
    background: rgba(6,9,16,0.92);
    border: 1px solid rgba(80,150,255,0.25);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 200;
    pointer-events: none;
    white-space: pre;
    backdrop-filter: blur(6px);
  }
  #debug-readout.hidden { display: none; }
</style>
<script>
  (function() {
    const btn = document.getElementById('debug-toggle');
    const panel = document.getElementById('debug-readout');
    btn.addEventListener('click', () => {
      const open = panel.classList.toggle('hidden');
      btn.classList.toggle('open', !open);
    });
  })();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/multi-app.js"></script>
</body>
</html>
