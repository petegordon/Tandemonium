<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Tandemonium</title>
<style>body{margin:0;background:#1a1410;color:#f3e6cf;font:16px system-ui,sans-serif;display:grid;place-items:center;height:100vh}</style>
</head>
<body>
<p>Bringing your saved rides over…</p>
<script type="module">
  // Receives saved data from the old address (see js/domain-migrate.js), then continues.
  import { decodePayload, applyEntries, resolveTarget, cameFromOldSite } from '../js/domain-migrate.js';
  const go = (to) => location.replace(resolveTarget(to, location.origin));
  const raw = new URLSearchParams(location.hash.slice(1)).get('d');
  // Drop the data from the address bar and history right away.
  history.replaceState(null, '', location.pathname);
  let to = '/';
  try {
    if (raw) {
      const data = await decodePayload(raw);
      to = data.to;
      if (cameFromOldSite(document.referrer)) {
        const added = applyEntries(localStorage, data.ls);
        localStorage.setItem('tandemonium_migrated_from', JSON.stringify({ from: 'jimandi.love', added, at: new Date().toISOString() }));
      }
    }
  } catch (e) {
    console.warn('[migrate] skipped:', e);
  }
  go(to);
</script>
</body>
</html>
