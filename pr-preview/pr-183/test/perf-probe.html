<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tandemonium — Perf Probe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #1a1a2e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 24px; }

  #gpu-info {
    font: 12px 'SF Mono', 'Fira Code', 'Menlo', monospace;
    color: rgba(255,255,255,0.6);
    margin-bottom: 16px;
    text-align: center;
    word-break: break-all;
    max-width: 600px;
  }

  #run-btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 24px;
  }
  #run-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  #run-btn:disabled { opacity: 0.5; cursor: default; }
  #run-btn.gamepad-focus { outline: 2px solid #fff; outline-offset: 3px; }

  #verdict {
    font-size: 20px;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: none;
  }
  #verdict.low { display: block; background: rgba(255,50,50,0.2); border: 1.5px solid #f44; color: #f66; }
  #verdict.ok  { display: block; background: rgba(50,255,50,0.2); border: 1.5px solid #4f4; color: #6f6; }

  table {
    border-collapse: collapse;
    margin-bottom: 24px;
    width: 100%;
    max-width: 600px;
  }
  th, td {
    padding: 8px 14px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
  }
  th { color: rgba(255,255,255,0.5); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  td.num { font-family: 'SF Mono', 'Fira Code', monospace; text-align: right; }
  tr.skipped td { color: rgba(255,255,255,0.3); font-style: italic; }

  .back { margin-top: 16px; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 13px; }
  .back:hover { color: #fff; }

  #status { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px; min-height: 18px; }
</style>
</head>
<body>
  <h1>Perf Probe</h1>
  <p class="sub">Escalating GPU + subsystem stress test</p>
  <div id="gpu-info"></div>
  <div id="status"></div>
  <button id="run-btn">Run Probe</button>
  <div id="verdict"></div>
  <table id="results" style="display:none">
    <thead><tr><th>Step</th><th>Avg ms</th><th>Delta ms</th><th>FPS</th></tr></thead>
    <tbody id="results-body"></tbody>
  </table>
  <a class="back" href="index.html">&larr; Back to tests</a>

<script type="module">
  import { perfProbe } from '../js/perf-probe.js';

  const btn = document.getElementById('run-btn');
  const verdictEl = document.getElementById('verdict');
  const table = document.getElementById('results');
  const tbody = document.getElementById('results-body');
  const statusEl = document.getElementById('status');
  const gpuEl = document.getElementById('gpu-info');

  // Show GPU string immediately
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) gpuEl.textContent = 'GPU: ' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    }
  } catch (e) {}

  async function run() {
    btn.disabled = true;
    btn.textContent = 'Testing...';
    statusEl.textContent = 'Running escalating stress test (~3s)...';
    verdictEl.className = '';
    verdictEl.style.display = 'none';
    tbody.innerHTML = '';
    table.style.display = 'none';

    try {
      const result = await perfProbe();

      // Verdict
      verdictEl.textContent = result.verdict;
      verdictEl.className = result.lowEnd ? 'low' : 'ok';

      // GPU info
      gpuEl.textContent = 'GPU: ' + result.gpuRenderer;

      // Table
      for (const step of result.steps) {
        const tr = document.createElement('tr');
        if (step.skipped) {
          tr.className = 'skipped';
          tr.innerHTML = `<td>${step.step}</td><td colspan="3">SKIPPED — ${step.reason}</td>`;
        } else {
          tr.innerHTML = `<td>${step.step}</td><td class="num">${step.avgMs}</td><td class="num">${step.deltaMs >= 0 ? '+' : ''}${step.deltaMs}</td><td class="num">${step.avgFps}</td>`;
        }
        tbody.appendChild(tr);
      }
      table.style.display = '';
      statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
    }

    btn.disabled = false;
    btn.textContent = 'Run Again';
  }

  btn.addEventListener('click', run);

  // ── Gamepad navigation (A to press Run/Back) ──
  const focusables = [btn, document.querySelector('.back')];
  let focusIdx = 0;
  let prevA = false;
  let prevB = false;
  let prevNav = false;
  focusables[0].classList.add('gamepad-focus');

  function pollGamepad() {
    requestAnimationFrame(pollGamepad);
    const gp = navigator.getGamepads()[0];
    if (!gp) return;

    const up = (gp.buttons[12]?.pressed) || gp.axes[1] < -0.5;
    const down = (gp.buttons[13]?.pressed) || gp.axes[1] > 0.5;
    const a = gp.buttons[0]?.pressed;

    if ((up || down) && !prevNav) {
      focusables[focusIdx].classList.remove('gamepad-focus');
      focusIdx = up ? Math.max(0, focusIdx - 1) : Math.min(focusables.length - 1, focusIdx + 1);
      focusables[focusIdx].classList.add('gamepad-focus');
    }
    prevNav = up || down;

    if (a && !prevA) focusables[focusIdx].click();

    const b = gp.buttons[1]?.pressed;
    if (b && !prevB) window.location.href = 'index.html';

    prevA = a; prevB = b;
  }
  requestAnimationFrame(pollGamepad);
</script>
</body>
</html>
