<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><script>/* PR preview only (scripts/stage-preview.mjs): unchanged heavy files come from the live game through preview-sw.js */(function(){
var S="/pr-preview/pr-814/",K='preview-sw-reloaded:'+S,sw=navigator.serviceWorker;
if(!sw){console.warn('[preview] no service worker support: files this preview shares with the live game will be missing');return;}
function reloadOnce(why){
try{if(Date.now()-Number(sessionStorage.getItem(K)||0)<10000){console.warn('[preview] not reloading again ('+why+')');return;}sessionStorage.setItem(K,String(Date.now()));}catch(e){return;}
location.reload();}
var controlled=!!sw.controller;
sw.register(S+"preview-sw.js",{scope:S,updateViaCache:'none'}).then(function(r){if(controlled)return r.update();}).catch(function(e){console.warn('[preview] service worker failed to register or update',e);});
if(controlled)sw.addEventListener('controllerchange',function(){if(performance.now()<20000)reloadOnce('a newer build took over');else console.warn('[preview] a newer build took over; reload to be sure every file is from it');});
else sw.ready.then(function(){reloadOnce('the service worker is still not in control');});
})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Tandemonium</title>
<style>body{margin:0;background:#1a1410;color:#f3e6cf;font:16px system-ui,sans-serif;display:grid;place-items:center;height:100vh}</style>
</head>
<body>
<p>Bringing your saved rides over…</p>
<script type="module">
  // Receives saved data from the old address (see js/domain-migrate.js), then continues.
  import { decodePayload, applyEntries, resolveTarget, cameFromOldSite } from '../js/domain-migrate.js';
  const go = (to) => location.replace(resolveTarget(to, location.origin));
  const raw = new URLSearchParams(location.hash.slice(1)).get('d');
  // Drop the data from the address bar and history right away.
  history.replaceState(null, '', location.pathname);
  let to = '/';
  try {
    if (raw) {
      const data = await decodePayload(raw);
      to = data.to;
      if (cameFromOldSite(document.referrer)) {
        const added = applyEntries(localStorage, data.ls);
        localStorage.setItem('tandemonium_migrated_from', JSON.stringify({ from: 'jimandi.love', added, at: new Date().toISOString() }));
      }
    }
  } catch (e) {
    console.warn('[migrate] skipped:', e);
  }
  go(to);
</script>
</body>
</html>
