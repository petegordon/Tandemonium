# Phone-pad relay (#421). Separate from wrangler.toml (the RIDE TOGETHER relay)
# so either can deploy without the other.
name = "tandemonium-pad"
main = "pad-relay.js"
compatibility_date = "2024-09-23"

# #454 · Q5: custom domain (added in the dashboard 2026-10-23; kept here so a
# deploy never drops it). workers.dev stays on for older builds.
routes = [{ pattern = "tandemonium-remote.housetandem.com", custom_domain = true }]
workers_dev = true

[durable_objects]
bindings = [
    { name = "PAD_ROOM", class_name = "PadRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PadRoom"]

# #454: cap /pad connects per IP (padRateOk in pad-relay.js), so rooms opened
# by a script can't use up the free plan's daily request and storage limits.
# Normal play is a few connects a minute. namespace_id must be unique in the
# account (1001-1006 are tandemonium-api, 2001 is usersfirst-store).
[[unsafe.bindings]]
name = "PAD_LIMITER"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 30, period = 60 }
