# Phone-pad relay (#421). Separate from wrangler.toml (the RIDE TOGETHER relay)
# so either can deploy without the other.
name = "tandemonium-pad"
main = "pad-relay.js"
compatibility_date = "2024-09-23"

# #454 · Q5: custom domain (added in the dashboard 2026-10-23; kept here so a
# deploy never drops it). workers.dev stays on for older builds.
routes = [{ pattern = "tandemonium-remote.housetandem.com", custom_domain = true }]
workers_dev = true

[durable_objects]
bindings = [
    { name = "PAD_ROOM", class_name = "PadRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PadRoom"]

# Rate limits: the same two rules as the API (Pete 2026-11-09; padRateOk in
# pad-relay.js). namespace_id must be unique in the account (1008-1011 are
# tandemonium-api, 2001 is usersfirst-store).
# 1. Per player: 30 connects a minute for one seat of one room (code + role).
[[unsafe.bindings]]
name = "PAD_PLAYER_LIMITER"
type = "ratelimit"
namespace_id = "3002"
simple = { limit = 30, period = 60 }

# 2. Per IP: 300 a minute. A venue puts every phone and game on one IP; a
#    script opening rooms still stops here (#454: the free plan's daily limits).
[[unsafe.bindings]]
name = "PAD_IP_LIMITER"
type = "ratelimit"
namespace_id = "3003"
simple = { limit = 300, period = 60 }
