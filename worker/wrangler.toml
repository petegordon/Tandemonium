name = "tandemonium-relay"
main = "relay.js"
compatibility_date = "2024-01-01"

[durable_objects]
bindings = [
    { name = "TANDEM_ROOM", class_name = "TandemRoom" }
]

[vars]
TURN_KEY_ID = "511f7bebc794eaf760c3aeac64db8e84"
# TURN_KEY_API_TOKEN must be set via: wrangler secret put TURN_KEY_API_TOKEN
# RELAY_SECRET must be set via: wrangler secret put RELAY_SECRET

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "tandemonium_relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TandemRoom"]

# 2026-11-17 · per IP: room connects and TURN requests. Room codes are 4 characters,
# so guessing them must be slow; a venue's machines share one IP, hence the headroom.
[[unsafe.bindings]]
name = "RELAY_IP_LIMITER"
type = "ratelimit"
namespace_id = "1020"
simple = { limit = 120, period = 60 }
