<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Controller Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #eee;
    user-select: none;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── Drag region (top bar + splash) ── */
  #drag-bar {
    position: fixed;
    top: 0; left: 0; right: 80px;
    height: 40px;
    -webkit-app-region: drag;
    z-index: 100;
  }

  /* ── Settings gear ── */
  #settings-toggle {
    position: fixed;
    top: 6px; right: 8px;
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;  /* clickable */
    z-index: 110;
    transition: background 0.2s;
  }
  #settings-toggle:hover { background: rgba(255,255,255,0.25); }
  #settings-toggle svg { fill: #ccc; width: 16px; height: 16px; }

  /* ── Settings panel ── */
  #settings-panel {
    position: fixed;
    top: 38px; right: 8px;
    width: 240px;
    max-height: calc(100vh - 50px);
    overflow-y: auto;
    background: rgba(30,30,35,0.92);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 14px;
    z-index: 120;
    display: none;
    backdrop-filter: blur(10px);
    -webkit-app-region: no-drag;
  }
  #settings-panel.visible { display: block; }

  #settings-close {
    position: absolute;
    top: 8px; right: 8px;
    width: 22px; height: 22px;
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 50%;
    color: #888;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #settings-close:hover { background: rgba(255,255,255,0.2); color: #fff; }

  #settings-panel h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .setting-row label { color: #bbb; }

  .setting-row select,
  .setting-row button {
    background: rgba(255,255,255,0.08);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  .setting-row select:hover,
  .setting-row button:hover {
    background: rgba(255,255,255,0.15);
  }

  .setting-row input[type="color"] {
    width: 32px;
    height: 24px;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .setting-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  .setting-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

  .setting-row input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: #3388ff;
    cursor: pointer;
  }
  .settings-divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 10px 0;
  }

  .combo-display {
    font-size: 10px;
    color: #8af;
    font-family: monospace;
    white-space: nowrap;
  }

  .settings-action-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }
  .settings-action-btn:hover { opacity: 0.85; }
  .settings-action-btn.close { background: #2266cc; color: #fff; }
  .settings-action-btn.exit { background: #cc2222; color: #fff; }

  /* ── Exit confirmation dialog ── */
  #exit-confirm {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    background: rgba(0,0,0,0.6);
    -webkit-app-region: no-drag;
  }
  #exit-confirm.visible { display: flex; }
  #exit-confirm .dialog {
    background: rgba(30,30,35,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    backdrop-filter: blur(10px);
    max-width: 280px;
  }
  #exit-confirm .dialog p {
    font-size: 14px;
    margin-bottom: 18px;
    color: #ddd;
  }
  #exit-confirm .dialog-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  #exit-confirm .dialog-buttons button {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #exit-confirm .btn-cancel { background: rgba(255,255,255,0.12); color: #ccc; }
  #exit-confirm .btn-cancel:hover { background: rgba(255,255,255,0.2); }
  #exit-confirm .btn-exit-yes { background: #cc2222; color: #fff; }
  #exit-confirm .btn-exit-yes:hover { opacity: 0.85; }

  /* Window display toggles — cosmetic only, hidden by default.
     When "Show" is checked, the class is removed and element appears. */
  body:not(.show-title) #drag-bar,
  body:not(.show-title) #status-bar { opacity: 0; pointer-events: none; }
  body:not(.show-gyro) #gyro-toggle { opacity: 0; pointer-events: none; }
  body:not(.show-gear) #settings-toggle { opacity: 0; pointer-events: none; }
  body.hide-roll-hud #gyro-hud { display: none !important; }

  .camera-presets {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .camera-presets button {
    flex: 1;
    min-width: 48px;
    text-align: center;
    padding: 4px 2px;
    font-size: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .camera-presets button.selected {
    background: rgba(51,136,255,0.3);
    border-color: rgba(51,136,255,0.6);
    color: #fff;
  }
  .camera-presets button.nav-hover {
    outline: 2px solid rgba(255,255,255,0.6);
    outline-offset: 1px;
  }

  /* ── Status badges (top-right, left of gear) ── */
  #status-bar {
    position: fixed;
    top: 8px; right: 42px;
    display: flex;
    gap: 6px;
    z-index: 110;
    align-items: center;
  }
  .status-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(80,0,0,0.5);
    color: #c44;
    white-space: nowrap;
  }
  .status-badge.connected { color: #4f4; background: rgba(0,80,0,0.5); }

  #axis-readout {
    position: fixed;
    top: 40px; right: 42px;
    display: none;
    gap: 14px;
    font-family: monospace;
    font-size: 30px;
    font-weight: 600;
    z-index: 110;
    background: rgba(0,0,0,0.35);
    padding: 4px 12px;
    border-radius: 14px;
    pointer-events: none;
  }
  body.show-axis-readout #axis-readout { display: flex; }
  #axis-readout .ax-pitch { color: #44dd66; }
  #axis-readout .ax-roll { color: #ee4455; }
  #axis-readout .ax-yaw { color: #4488ff; }

  /* ── Gyro toggle button (emoji) ── */
  #gyro-toggle {
    position: fixed;
    top: 2px; right: 42px;
    background: none;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
    z-index: 110;
    font-size: 14px;
    line-height: 1;
    padding: 4px;
    gap: 1px;
  }
  #gyro-toggle .gyro-controller { font-size: 20px; }
  #gyro-toggle .gyro-indicator { font-size: 12px; }
  #gyro-toggle:hover { opacity: 0.8; }
  #gyro-toggle.visible { display: flex; }

  /* ── No-controller splash ── */
  #no-controller {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    -webkit-app-region: drag;
    transition: opacity 0.4s ease;
  }
  #no-controller.hidden { display: none; }
  #no-controller .splash-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #no-controller .splash-emoji {
    font-size: min(45vw, 45vh);
    line-height: 1;
    filter: grayscale(0.3);
  }
  #no-controller .splash-prohibit {
    position: absolute;
    width: min(60vw, 60vh);
    height: min(60vw, 60vh);
  }
  #no-controller .splash-prohibit circle,
  #no-controller .splash-prohibit line {
    stroke: #cc3333;
    stroke-width: 8;
    fill: none;
    opacity: 0.85;
  }

  /* ── Gyro HUD (arc, arrows, calibration text) ── */
  #gyro-hud {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 40;
  }
  #gyro-hud.visible { display: block; position: fixed; }

  #gyro-hud.pos-below { bottom: 4%; }
  #gyro-hud.pos-above { top: 4%; }

  #arc-svg {
    display: block;
    width: min(55vw, 240px);
    height: auto;
  }

  .gyro-hud-footer {
    position: absolute;
    left: 0; right: 0;
    top: 48%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  #lean-arrow-left, #lean-arrow-right {
    font-size: 18px;
    opacity: 0.1;
    transition: opacity 0.05s;
    user-select: none;
  }

  #calib-hint {
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    transition: opacity 0.5s;
    min-width: 100px;
  }
  #calib-hint.hidden { opacity: 0; }

  /* ── 3D gyro gimbal widget (above controller) ── */
  #gimbal-canvas {
    position: fixed;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: min(36vw, 220px);
    height: min(36vw, 220px);
    pointer-events: none;
    z-index: 45;
    display: none;
  }
  body.show-gimbal #gimbal-canvas { display: block; }

  /* ── Click-through indicator ── */
  #click-through-indicator {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 2px solid rgba(255,100,0,0.4);
    pointer-events: none;
    z-index: 200;
    display: none;
    border-radius: 4px;
  }
  #click-through-indicator.active { display: block; }
</style>
</head>
<body>

<!-- Drag region for window repositioning -->
<div id="drag-bar"></div>

<!-- Gyro toggle button (appears when gyro-capable controller connected) -->
<button id="gyro-toggle" title="Gyro: click to toggle"><span class="gyro-controller">&#x1F3AE;</span><span class="gyro-indicator">&#x274C;</span></button>

<!-- Settings gear button -->
<button id="settings-toggle" title="Settings">
  <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
</button>

<!-- Settings panel -->
<div id="settings-panel">
  <button id="settings-close" title="Close">&times;</button>
  <h3>Controller Overlay</h3>

  <div class="setting-row">
    <label>Controller</label>
    <select id="controller-type">
      <option value="auto">Auto-detect</option>
      <option value="dualsense">DualSense</option>
      <option value="switch-pro">Switch Pro</option>
    </select>
  </div>

  <div class="setting-row">
    <label>Gyro (WebHID)</label>
    <button id="connect-gyro-btn">Connect</button>
  </div>

  <div class="setting-row">
    <label>Gravity Correction</label>
    <select id="drift-mode">
      <option value="off">Off</option>
      <option value="gentle" selected>Gentle</option>
      <option value="strong">Strong</option>
    </select>
  </div>

  <div class="setting-row">
    <label>Opacity</label>
    <input type="range" id="opacity-slider" min="10" max="100" value="100" style="width:90px;accent-color:#3388ff;">
    <span id="opacity-value" style="min-width:28px;text-align:right;font-size:11px;">100%</span>
  </div>

  <div class="setting-row">
    <label>Body Color</label>
    <input type="color" id="body-color" value="#e8e8ec">
  </div>

  <div class="setting-row">
    <label>Accent Color</label>
    <input type="color" id="accent-color" value="#1a1a1e">
  </div>

  <div class="setting-row">
    <label>Camera</label>
  </div>
  <div class="camera-presets" data-row="0">
    <button data-preset="front">Front</button>
    <button data-preset="back">Back</button>
    <button data-preset="left">Left</button>
    <button data-preset="right">Right</button>
  </div>
  <div class="camera-presets" data-row="1">
    <button data-preset="player">Player</button>
    <button data-preset="top">Top</button>
  </div>

  <div class="setting-row">
    <label>HUD Position</label>
    <select id="hud-position">
      <option value="above" selected>Above</option>
      <option value="below">Below</option>
    </select>
  </div>

  <hr class="settings-divider">
  <h3>Window Display</h3>
  <div class="setting-row">
    <label>Show Title Bar</label>
    <input type="checkbox" id="show-title">
  </div>
  <div class="setting-row">
    <label>Show Gyro Toggle</label>
    <input type="checkbox" id="show-gyro">
  </div>
  <div class="setting-row">
    <label>Show Gear Icon</label>
    <input type="checkbox" id="show-gear">
  </div>
  <div class="setting-row">
    <label>Show Roll HUD</label>
    <input type="checkbox" id="show-roll-hud" checked>
  </div>
  <div class="setting-row">
    <label>Show Axis Values</label>
    <input type="checkbox" id="show-axis-readout">
  </div>
  <div class="setting-row">
    <label>Show 3D Gyro</label>
    <input type="checkbox" id="show-gimbal">
  </div>
  <div class="setting-row">
    <label>Gimbal: full orientation</label>
    <input type="checkbox" id="gimbal-full-mode">
  </div>

  <hr class="settings-divider">
  <h3>Shortcuts</h3>
  <div class="setting-row">
    <label>Settings</label>
    <span class="combo-display" id="combo-label-settings">Select + Start</span>
    <button data-remap="settings" id="combo-remap-settings">Remap</button>
  </div>
  <div class="setting-row">
    <label>Gyro On/Off</label>
    <span class="combo-display" id="combo-label-gyroToggle">Select + R3</span>
    <button data-remap="gyroToggle" id="combo-remap-gyroToggle">Remap</button>
  </div>
  <div class="setting-row">
    <label>Calibrate</label>
    <span class="combo-display" id="combo-label-calibrate">L3 + R3</span>
    <button data-remap="calibrate" id="combo-remap-calibrate">Remap</button>
  </div>

  <hr class="settings-divider">
  <div class="setting-row">
    <button class="settings-action-btn close" id="btn-close-settings">CLOSE SETTINGS</button>
  </div>
  <div class="setting-row">
    <button class="settings-action-btn exit" id="btn-exit-app">EXIT APPLICATION</button>
  </div>
</div>

<!-- Exit confirmation dialog -->
<div id="exit-confirm">
  <div class="dialog">
    <p>Are you sure you want to exit the application?</p>
    <div class="dialog-buttons">
      <button class="btn-cancel" id="exit-cancel">Cancel</button>
      <button class="btn-exit-yes" id="exit-yes">Exit</button>
    </div>
  </div>
</div>

<!-- Status indicator -->
<div id="status-bar">
  <span class="status-badge" id="gamepad-status">No gamepad</span>
</div>

<!-- Live axis readout (pitch/yaw/roll in degrees) -->
<div id="axis-readout">
  <span class="ax-pitch">P <span id="ax-pitch-val">0°</span></span>
  <span class="ax-roll">R <span id="ax-roll-val">0°</span></span>
  <span class="ax-yaw">Y <span id="ax-yaw-val">0°</span></span>
</div>

<!-- Gyro HUD -->
<div id="gyro-hud">
  <svg id="arc-svg" viewBox="-120 -105 240 115">
    <!-- Arc band background -->
    <path id="arc-band" d="" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
    <!-- Tick marks -->
    <g id="arc-ticks" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"></g>
    <!-- Needle -->
    <line id="arc-needle" x1="0" y1="-4" x2="0" y2="-22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="rgba(255,255,255,0.4)"/>
  </svg>
  <div class="gyro-hud-footer">
    <span id="lean-arrow-left">&#x25C0;</span>
    <span id="calib-hint" class="hidden"></span>
    <span id="lean-arrow-right">&#x25B6;</span>
  </div>
</div>

<!-- No-controller splash (shown until a gamepad connects) -->
<div id="no-controller">
  <div class="splash-icon">
    <div class="splash-emoji">&#x1F3AE;</div>
    <svg class="splash-prohibit" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45"/>
      <line x1="18" y1="18" x2="82" y2="82"/>
    </svg>
  </div>
</div>

<!-- 3D gyro gimbal widget canvas -->
<canvas id="gimbal-canvas"></canvas>

<!-- Click-through mode indicator -->
<div id="click-through-indicator"></div>

<!-- WebGL canvas -->
<canvas id="canvas"></canvas>

<script>
// Dynamic importmap: use local vendor files in Electron, CDN on the web
(function() {
  const isElectron = navigator.userAgent.includes('Electron');
  const map = isElectron
    ? { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" }
    : { "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/" };
  const el = document.createElement('script');
  el.type = 'importmap';
  el.textContent = JSON.stringify({ imports: map });
  document.currentScript.after(el);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
