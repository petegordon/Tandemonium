<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Physics FX smoke harness</title>
<!--
  Headless harness for the Rapier sidecar (issue #388). Driven by
  scripts/smoke-physics-fx.mjs; open it directly in a browser to eyeball the
  same assertions in the console.

  No WebGL and no game: this exercises the solver wiring on its own, which is
  the part that can't be checked by reading — the Rapier API surface, the
  per-body ground patches, the collision-group isolation that keeps them from
  catching each other's debris, and the body lifecycle.
-->
<style>
  body { font: 13px/1.5 ui-monospace, monospace; background: #111; color: #ddd; padding: 16px; }
  .pass { color: #6ee7a0; }
  .fail { color: #ff6b81; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { ensureRapier } from '../js/physics/rapier-runtime.js';
import { DebrisWorld } from '../js/physics/debris-world.js';
import { PhysicsFx, billboardRoll } from '../js/physics/physics-fx.js';

const results = [];
function check(name, cond, detail = '') {
  results.push({ name, pass: !!cond, detail: String(detail) });
}

/** Step a world for `seconds` at a steady 60Hz, as the game loop would. */
function run(world, seconds) {
  const dt = 1 / 60;
  for (let i = 0; i < Math.round(seconds / dt); i++) world.step(dt);
}

function obj() {
  const o = new THREE.Object3D();
  o.quaternion.set(0, 0, 0, 1);
  return o;
}

async function main() {
  // ── fail-open, before anything is loaded ──
  const cold = new PhysicsFx(null, null);
  check('PhysicsFx starts not-ready', cold.ready === false);
  check('crashTumble no-ops when cold', cold.crashTumble({ group: obj() }) === false);
  check('knockProp no-ops when cold', cold.knockProp(obj(), { x: 0, y: 0, z: 0 }, 0, 10, 0) === false);
  check('strikeGoose no-ops when cold', cold.strikeGoose(obj(), { x: 0, y: 0, z: 0 }, 0, 10, 0) === null);
  check('releaseCrash tolerates a cold facade', (() => {
    try { cold.releaseCrash({}); return true; } catch (e) { return false; }
  })());

  const RAPIER = await ensureRapier();
  check('Rapier loads (CDN or vendor fallback)', !!RAPIER, RAPIER ? '' : 'null');
  if (!RAPIER) return;

  const scene = new THREE.Scene();

  // ── a body falls and lands ON its patch, not through it ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    const o = obj();
    const h = w.spawn({
      object3d: o,
      halfExtents: { x: 0.25, y: 0.25, z: 0.25 },
      position: { x: 0, y: 3, z: 0 },
      groundY: 0,
      lifetime: 30,
    });
    check('spawn returns a handle', !!h);
    run(w, 2.5);
    const y = o.position.y;
    // Box half-height 0.25 resting on y=0 puts its centre at 0.25.
    check('body lands on its patch', Math.abs(y - 0.25) < 0.12, `y=${y.toFixed(3)}`);
    check('body did not tunnel', y > -0.2, `y=${y.toFixed(3)}`);
    w.dispose();
  }

  // ── CCD: debris leaving at ride speed must not tunnel the patch ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    const o = obj();
    // 40 m/s straight down is ~0.67m per step against a 0.5m-thick patch —
    // without continuous collision detection this passes clean through.
    w.spawn({
      object3d: o,
      halfExtents: { x: 0.2, y: 0.2, z: 0.2 },
      position: { x: 0, y: 6, z: 0 },
      linvel: { x: 0, y: -40, z: 0 },
      groundY: 0,
      lifetime: 30,
    });
    run(w, 2.0);
    check('fast debris is caught, not tunnelled',
      o.position.y > -0.5, `y=${o.position.y.toFixed(3)}`);
    w.dispose();
  }

  // ── the patch tracks terrain height, so a hill is respected ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    const o = obj();
    w.spawn({
      object3d: o,
      halfExtents: { x: 0.25, y: 0.25, z: 0.25 },
      position: { x: 0, y: 15.2, z: 0 },
      groundY: 12.5,
      lifetime: 30,
    });
    run(w, 2.5);
    check('patch sits at the given ground height',
      Math.abs(o.position.y - 12.75) < 0.12, `y=${o.position.y.toFixed(3)}`);
    w.dispose();
  }

  // ── collision groups keep neighbours off each other's patch ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    const low = obj();
    const high = obj();
    // Overlapping patches (1m apart, patch half-extent 3m) at different
    // heights. Without group isolation the low one lands on the high one's
    // patch at y≈5.25 instead of its own at y≈0.25.
    w.spawn({
      object3d: low, halfExtents: { x: 0.25, y: 0.25, z: 0.25 },
      position: { x: 0, y: 3, z: 0 }, groundY: 0, lifetime: 30,
    });
    w.spawn({
      object3d: high, halfExtents: { x: 0.25, y: 0.25, z: 0.25 },
      position: { x: 1, y: 8, z: 0 }, groundY: 5, lifetime: 30,
    });
    run(w, 3.0);
    check('neighbouring debris lands on its OWN patch',
      Math.abs(low.position.y - 0.25) < 0.15 && Math.abs(high.position.y - 5.25) < 0.15,
      `low=${low.position.y.toFixed(2)} high=${high.position.y.toFixed(2)}`);
    w.dispose();
  }

  // ── lifetime, onExpire, and the final sample taken before the free ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    let fired = 0;
    let finalSeen = null;
    w.spawn({
      object3d: obj(),
      position: { x: 2, y: 4, z: -1 },
      groundY: 0,
      lifetime: 0.5,
      onExpire: (o, final) => { fired++; finalSeen = final; },
    });
    run(w, 1.0);
    check('onExpire fires exactly once', fired === 1, `fired=${fired}`);
    check('onExpire receives a final position',
      !!finalSeen && Number.isFinite(finalSeen.position.y), JSON.stringify(finalSeen));
    check('onExpire receives a final velocity',
      !!finalSeen && Number.isFinite(finalSeen.linvel.y));
    check('world empties itself', w.liveCount === 0, `live=${w.liveCount}`);
    w.dispose();
  }

  // ── the body cap holds ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    let nulls = 0;
    for (let i = 0; i < 40; i++) {
      const h = w.spawn({
        object3d: obj(), position: { x: i, y: 5, z: 0 }, groundY: 0, lifetime: 30,
      });
      if (!h) nulls++;
    }
    check('spawn is capped', nulls > 0 && w.liveCount <= 24, `live=${w.liveCount} refused=${nulls}`);
    w.dispose();
  }

  // ── billboards: rotation is published but not applied ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    const o = obj();
    const h = w.spawn({
      object3d: o,
      position: { x: 0, y: 4, z: 0 },
      groundY: 0,
      angvel: { x: 6, y: 3, z: 5 },
      lifetime: 30,
      driveRotation: false,
    });
    run(w, 0.5);
    const untouched = o.quaternion.x === 0 && o.quaternion.y === 0
      && o.quaternion.z === 0 && o.quaternion.w === 1;
    check('billboard quaternion is left alone', untouched,
      `q=${o.quaternion.toArray().map(n => n.toFixed(2)).join(',')}`);
    check('billboard body still publishes its rotation',
      Math.abs(h.quat.w) < 0.999, `w=${h.quat.w.toFixed(3)}`);
    check('billboard position IS driven', o.position.y < 4, `y=${o.position.y.toFixed(2)}`);

    // Roll projection, against a camera looking down -Z from +Z.
    const cam = new THREE.PerspectiveCamera(70, 1, 0.1, 500);
    cam.position.set(0, 0, 10);
    cam.lookAt(0, 0, 0);
    cam.updateMatrixWorld(true);
    // Deterministic roll: a body rolled about the view axis keeps its local +X
    // square to the camera, so the projection is strong and the angle must come
    // back as exactly that roll. (The tumbling body above is not used for this
    // — its axis wanders, and a test that accepts null proves nothing.)
    for (const want of [0, Math.PI / 4, -Math.PI / 3, 2.0]) {
      const q = new THREE.Quaternion()
        .setFromAxisAngle(new THREE.Vector3(0, 0, 1), want);
      const got = billboardRoll(q, cam);
      check(`billboardRoll reads a ${want.toFixed(2)}rad view-axis roll`,
        got !== null && Math.abs(got - want) < 1e-6, `got=${got}`);
    }

    // A body whose local +X points straight at the camera has no readable
    // screen-space roll, and must report null rather than atan2 noise.
    const edgeOn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
    check('billboardRoll declines a degenerate projection',
      billboardRoll(edgeOn, cam) === null, String(billboardRoll(edgeOn, cam)));
    w.dispose();
  }

  // ── early release still fires onExpire ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    let fired = 0;
    const h = w.spawn({
      object3d: obj(), position: { x: 0, y: 4, z: 0 }, groundY: 0,
      lifetime: 30, onExpire: () => { fired++; },
    });
    run(w, 0.2);
    w.release(h);
    check('release() retires the body', fired === 1 && w.liveCount === 0,
      `fired=${fired} live=${w.liveCount}`);
    // Stepping on after a release must not touch the freed body.
    run(w, 0.2);
    check('stepping after release is safe', true);
    w.dispose();
  }

  // ── clear() drains, dispose() frees ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    let fired = 0;
    for (let i = 0; i < 5; i++) {
      w.spawn({
        object3d: obj(), position: { x: i, y: 4, z: 0 }, groundY: 0,
        lifetime: 30, onExpire: () => { fired++; },
      });
    }
    w.clear();
    check('clear() retires everything', fired === 5 && w.liveCount === 0,
      `fired=${fired} live=${w.liveCount}`);
    w.dispose();
    check('dispose() releases the world', w.world === null);
  }

  // ── the edited game modules still resolve ──
  //
  // geese.js now imports physics-fx.js, which imports three and
  // debris-world.js. A wrong path here doesn't degrade the feature, it stops
  // the entire game loading — so it is worth an assertion of its own.
  {
    try {
      const [geese, obstacles, bike, config] = await Promise.all([
        import('../js/geese.js'),
        import('../js/obstacles.js'),
        import('../js/bike-model.js'),
        import('../js/config.js'),
      ]);
      check('geese.js resolves with the physics import', !!geese.GeeseManager);
      check('obstacles.js resolves', !!obstacles.ObstacleManager);
      check('bike-model.js resolves', !!bike.BikeModel);
      check('config exposes getPhysicsFx', typeof config.getPhysicsFx === 'function');
      check('getPhysicsFx returns a boolean', typeof config.getPhysicsFx() === 'boolean',
        String(config.getPhysicsFx()));
    } catch (err) {
      check('edited game modules resolve', false, String(err));
    }
  }

  // ── a big frame gap must not stall the loop ──
  {
    const w = new DebrisWorld(RAPIER, scene);
    const o = obj();
    w.spawn({
      object3d: o, position: { x: 0, y: 3, z: 0 }, groundY: 0, lifetime: 30,
    });
    const t0 = performance.now();
    w.step(8.0); // a tab-switch worth of dt
    const ms = performance.now() - t0;
    check('a huge dt is clamped, not drained', ms < 250, `${ms.toFixed(1)}ms`);
    w.dispose();
  }
}

main().then(() => {
  const failed = results.filter((r) => !r.pass);
  window.__results = results;
  window.__done = true;
  document.getElementById('out').innerHTML = results.map((r) =>
    `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>  ${r.name}${r.detail ? '  — ' + r.detail : ''}`
  ).join('\n') + `\n\n${results.length - failed.length}/${results.length} passed`;
}).catch((err) => {
  window.__results = results.concat([{ name: 'harness threw', pass: false, detail: String(err && err.stack || err) }]);
  window.__done = true;
  document.getElementById('out').textContent = 'ERROR: ' + (err && err.stack || err);
});
</script>
</body>
</html>
