<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controller Overlay HUD — harness</title>
<!--
  Exercises js/controller-overlay-hud.js without the game: fake ControllerManager
  slots driven by synthetic, self-animating gamepads, plus stand-ins for the
  things the tiles must dodge (front-view selfie cam, partner PiP, pedal bars).
  Switch scenarios with the buttons (or ?scenario=solo|local|versus|lobby).

  three resolves from the CDN like index.html; pass ?three=/node_modules/three/
  (or any base URL that has build/ and examples/jsm/) to use a local copy —
  scripts/smoke-controller-overlay.mjs drives this page headless that way.
-->
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var base = params.get('three') || 'https://cdn.jsdelivr.net/npm/three@0.161.0/';
    if (!base.endsWith('/')) base += '/';
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: {
      'three': base + 'build/three.module.js',
      'three/addons/': base + 'examples/jsm/',
    } });
    document.currentScript.after(im);
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #24303a; color: #ddd;
    font-family: 'Helvetica Neue', Arial, sans-serif; }
  #controls { position: fixed; top: 12px; left: 12px; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; font-size: 13px; max-width: 70vw; }
  #controls button { padding: 6px 12px; border-radius: 6px; border: 1px solid #556; background: #1c242b; color: #eee; cursor: pointer; }
  #controls button.on { border-color: #44ff66; color: #44ff66; }
  #status { position: fixed; top: 52px; left: 12px; z-index: 100; font: 11px/1.5 monospace; color: #9ab; white-space: pre; }
  /* stand-ins for what the ride draws in the corners */
  .front-view-frame { position: fixed; z-index: 40; border: 3px solid rgba(255,255,255,0.92); border-radius: 14px;
    background: rgba(255,255,255,0.08); display: none; }
  .front-view-frame::after { content: 'FRONT VIEW'; position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #fff; }
  #partner-pip-wrap { position: fixed; z-index: 11; display: none; width: 160px; height: 120px; right: 24px; bottom: 24px;
    background: rgba(255,160,60,0.25); border: 2px dashed #fa5; border-radius: 8px; }
  #bottom-hud { position: fixed; left: 0; right: 0; bottom: 0; display: none; }
  #pedal-bar { display: flex; justify-content: center; gap: 10px; padding: 0 10px; width: 100%; height: 90px; background: rgba(120,60,200,0.18); }
  .versus-pedals { display: none; position: fixed; bottom: 12px; height: 80px; background: rgba(120,60,200,0.18); z-index: 45; }
  body.mode-versus #versus-pedals-a { display: flex; left: 0; width: 50%; }
  body.mode-versus #versus-pedals-b { display: flex; left: 50%; width: 50%; }
  #versus-divider { display: none; position: fixed; top: 0; left: 50%; width: 2px; height: 100%; margin-left: -1px; background: rgba(255,255,255,0.35); z-index: 40; }
  body.mode-versus #versus-divider { display: block; }
</style>
</head>
<body>
  <div id="controls">
    <span>Scenario:</span>
    <button data-scenario="solo">Solo</button>
    <button data-scenario="local">Local co-op</button>
    <button data-scenario="versus">Versus</button>
    <button data-scenario="lobby">Lobby (4 pads)</button>
    <button data-scenario="steam">Steam Input only</button>
    <span style="margin-left:12px">Obstacles:</span>
    <button data-obstacle="frontview">Front view</button>
    <button data-obstacle="pip">Partner PiP</button>
    <button data-obstacle="pedals">Pedal bar</button>
    <button id="toggle-hud" style="margin-left:12px">HUD: on (C)</button>
  </div>
  <div id="status"></div>

  <div class="front-view-frame" id="fv-main"></div>
  <div class="front-view-frame" id="fv-a"></div>
  <div class="front-view-frame" id="fv-b"></div>
  <div id="partner-pip-wrap"></div>
  <div id="bottom-hud"><div id="pedal-bar"></div></div>
  <div class="versus-pedals" id="versus-pedals-a"></div>
  <div class="versus-pedals" id="versus-pedals-b"></div>
  <div id="versus-divider"></div>
  <div id="controller-overlay" hidden></div>

<script type="module">
import * as THREE from 'three';
import { ControllerOverlayHud } from '../js/controller-overlay-hud.js';
import { TEAM_COLORS } from '../js/versus/team-rig.js';

// ── Fake pads: standard-mapping shape, self-animating so every tile moves ──
const IDS = {
  P1: 'DualSense Wireless Controller (STANDARD GAMEPAD Vendor: 054c Product: 0ce6)',
  P2: 'Xbox 360 Controller (XInput STANDARD GAMEPAD)',
  P3: 'Pro Controller (STANDARD GAMEPAD Vendor: 057e Product: 2009)',
  P4: 'Steam Controller (STANDARD GAMEPAD Vendor: 28de Product: 1304)',
};
function makePad(index, id) {
  return {
    index, id, connected: true, mapping: 'standard',
    buttons: Array.from({ length: 18 }, () => ({ pressed: false, touched: false, value: 0 })),
    axes: [0, 0, 0, 0],
  };
}
const pads = [makePad(0, IDS.P1), makePad(1, IDS.P2), makePad(2, IDS.P3), makePad(3, IDS.P4)];
function animatePads(t) {
  pads.forEach((p, i) => {
    const ph = t / 1000 + i * 1.3;
    p.axes[0] = Math.sin(ph) * 0.9;  p.axes[1] = Math.cos(ph * 0.7) * 0.9;
    p.axes[2] = Math.cos(ph * 1.1) * 0.6; p.axes[3] = Math.sin(ph * 0.5) * 0.6;
    for (let b = 0; b < 16; b++) {
      const on = Math.sin(ph * 2 + b * 0.9) > 0.85;
      p.buttons[b].pressed = on; p.buttons[b].value = on ? 1 : 0;
    }
    p.buttons[6].value = (Math.sin(ph * 1.7) + 1) / 2; p.buttons[6].pressed = p.buttons[6].value > 0.5;
    p.buttons[7].value = (Math.cos(ph * 1.3) + 1) / 2; p.buttons[7].pressed = p.buttons[7].value > 0.5;
  });
}

// ── Fake slots: the tiny Slot surface the HUD touches ──
class FakeSlot {
  constructor(id) { this.id = id; this.state = 'empty'; this.gamepadIndex = null; this.controllerLabel = null; this.fusion = null; this._hidEntry = null; this._l = []; }
  on(fn) { this._l.push(fn); return () => { this._l = this._l.filter((f) => f !== fn); }; }
  claim(pad) { this.state = 'claimed'; this.gamepadIndex = pad.index; this.controllerLabel = pad.id; }
  release() { this.state = 'empty'; this.gamepadIndex = null; this.controllerLabel = null; }
  effectiveGamepad(list) { return this.gamepadIndex != null ? list[this.gamepadIndex] : null; }
}
const manager = { slots: ['P1', 'P2', 'P3', 'P4'].map((id) => new FakeSlot(id)) };
manager.getSlot = (id) => manager.slots.find((s) => s.id === id) || null;
manager.slots.forEach((s, i) => s.claim(pads[i]));
// P2 is the Steam case: Steam's virtual XInput pad is what the Gamepad API
// sees (so the id says "Xbox 360"), but the slot's WebHID binding is the real
// DualSense — the tile must name and model it as a DualSense.
manager.getSlot('P2')._hidEntry = { device: { vendorId: 0x054c, productId: 0x0ce6, productName: 'DualSense Wireless Controller' } };

// ── Fake InputManager on Steam Input: what a DualSense looks like when Steam
// owns it exclusively in the packaged build — NO slot (Electron surfaces no
// Gamepad-API device), buttons from the bound actions, gyro from the
// per-handle fusion fed by getMotionData. Type arrives as the enum string.
// A real THREE.Quaternion, like SensorFusion's — Three's slerp reads the
// private _x/_y/_z/_w fields, so a plain {x,y,z,w} would go NaN and hide
// the model (which the smoke test's finite-quaternion check would catch).
const steamOrientation = new THREE.Quaternion();
const steamInput = {
  _steamInputActive: true,
  _steamFusions: new Map([['h1', { calibrating: false, orientation: steamOrientation }]]),
  _selectedSteamEntry() {
    const ph = performance.now() / 1000;
    return { handle: 'h1', type: '13', steerX: Math.sin(ph) * 0.8, steerY: 0, active: true,
      digital: { Confirm: Math.sin(ph * 3) > 0.7, Cancel: false, PedalLeft: Math.sin(ph * 2) > 0, PedalRight: Math.sin(ph * 2) <= 0,
        MenuUp: false, MenuDown: false, MenuLeft: false, MenuRight: false, Pause: false },
      motion: { rotQuat: [0, 0, 0, 1], accel: [0, 0, 1], rotVel: [0, 0, 0] } };
  },
  _buildSteamInputGamepad() {
    const c = this._selectedSteamEntry(); const d = c.digital;
    const btn = (p) => ({ pressed: !!p, touched: !!p, value: p ? 1 : 0 });
    return { id: `DualSense via Steam Input (${c.type} Vendor: 054c Product: 0ce6)`, index: -1, mapping: 'standard', connected: true,
      buttons: [btn(d.Confirm), btn(d.Cancel), btn(0), btn(0), btn(d.PedalLeft), btn(d.PedalRight), btn(d.PedalLeft), btn(d.PedalRight),
        btn(0), btn(d.Pause), btn(0), btn(0), btn(d.MenuUp), btn(d.MenuDown), btn(d.MenuLeft), btn(d.MenuRight), btn(0), btn(0)],
      axes: [c.steerX, c.steerY, 0, 0], _isSyntheticSteamInput: true };
  },
};
const idleInput = { _steamInputActive: false, _steamFusions: new Map(), _selectedSteamEntry: () => null };
function animateSteamGyro(t) {
  // roll the fake orientation about Z so the model visibly tilts
  const a = Math.sin(t / 700) * 0.35;
  steamOrientation.setFromAxisAngle(new THREE.Vector3(0, 0, 1), a);
}

// ── Scenarios → the ctx the game passes each frame ──
const ctx = { state: 'playing', mode: 'solo', manager, versusRigs: null, input: idleInput, inputP2: null, localP2Type: null, pads };
const scenarios = {
  solo:   () => { ctx.state = 'playing'; ctx.mode = 'solo'; ctx.versusRigs = null; ctx.inputP2 = null; ctx.localP2Type = null; },
  steam:  () => { ctx.state = 'playing'; ctx.mode = 'solo'; ctx.versusRigs = null; ctx.inputP2 = null; ctx.localP2Type = null; },
  local:  () => { ctx.state = 'playing'; ctx.mode = 'local'; ctx.versusRigs = null; ctx.inputP2 = { _slot: manager.getSlot('P2') }; ctx.localP2Type = 'gamepad'; },
  lobby:  () => { ctx.state = 'lobby';   ctx.mode = 'solo'; ctx.versusRigs = null; ctx.inputP2 = null; ctx.localP2Type = null; },
  versus: () => {
    ctx.state = 'playing'; ctx.mode = 'versus'; ctx.inputP2 = null; ctx.localP2Type = null;
    ctx.versusRigs = [
      { id: 'A', color: TEAM_COLORS.A, members: [
        { type: 'gamepad', slotId: 'P1', name: 'P1', isP1: true },
        { type: 'gamepad', slotId: 'P2', name: 'P2', isP1: false } ] },
      { id: 'B', color: TEAM_COLORS.B, members: [
        { type: 'gamepad', slotId: 'P3', name: 'P3', isP1: false },
        { type: 'keyboard', slotId: null, name: 'KB', isP1: false } ] },
    ];
  },
};
let scenario = new URLSearchParams(location.search).get('scenario') || 'solo';
function setScenario(name) {
  scenario = scenarios[name] ? name : 'solo';
  scenarios[scenario]();
  // Steam-only: P1's slot is EMPTY and its InputManager reads Steam Input.
  const p1 = manager.getSlot('P1');
  if (scenario === 'steam') { p1.release(); ctx.input = steamInput; }
  else { if (p1.state === 'empty') p1.claim(pads[0]); ctx.input = idleInput; }
  document.body.classList.toggle('mode-versus', scenario === 'versus');
  document.querySelectorAll('[data-scenario]').forEach((b) => b.classList.toggle('on', b.dataset.scenario === scenario));
  layoutObstacles();
}

// ── Obstacles (positioned like the game's own front view / PiP) ──
const obstacles = { frontview: false, pip: false, pedals: false };
function layoutObstacles() {
  const w = innerWidth, h = innerHeight;
  const bar = document.getElementById('bottom-hud');
  bar.style.display = obstacles.pedals && scenario !== 'versus' ? 'block' : 'none';
  const pip = document.getElementById('partner-pip-wrap');
  pip.style.display = obstacles.pip && scenario !== 'versus' ? 'block' : 'none';
  const fvMain = document.getElementById('fv-main'), fvA = document.getElementById('fv-a'), fvB = document.getElementById('fv-b');
  for (const el of [fvMain, fvA, fvB]) el.style.display = 'none';
  if (!obstacles.frontview) return;
  if (scenario === 'versus') {
    const halfW = Math.floor(w / 2);
    const size = Math.round(Math.min(halfW, h) * 0.30), margin = Math.round(Math.min(halfW, h) * 0.045);
    for (const [el, x] of [[fvA, 0], [fvB, w - halfW]]) {
      Object.assign(el.style, { display: 'block', width: size + 'px', height: size + 'px', left: (x + halfW - size - margin) + 'px', top: (h - size - margin) + 'px' });
    }
  } else {
    const size = Math.round(Math.min(w, h) * 0.28), margin = Math.round(Math.min(w, h) * 0.035);
    let left = w - size - margin, top = h - size - margin;
    if (obstacles.pip) { const r = pip.getBoundingClientRect(); left = Math.max(0, r.right - size); top = Math.max(0, r.top - size - Math.round(Math.min(w, h) * 0.02)); }
    else if (obstacles.pedals) { const r = document.getElementById('pedal-bar').getBoundingClientRect(); top = h - size - Math.max(margin, h - r.top + margin); }
    Object.assign(fvMain.style, { display: 'block', width: size + 'px', height: size + 'px', left: left + 'px', top: top + 'px' });
  }
}

// ── HUD ──
const hud = new ControllerOverlayHud({ assetBase: '../shared/visualizer/' });
hud.onChange = (on) => { document.getElementById('toggle-hud').textContent = `HUD: ${on ? 'on' : 'off'} (C)`; };
hud.setEnabled(true, { persist: false });
window.__hud = hud;
window.__ctx = ctx;
window.__setScenario = setScenario;
window.__setObstacle = (k, on) => { obstacles[k] = on; document.querySelector(`[data-obstacle="${k}"]`).classList.toggle('on', on); layoutObstacles(); };
window.__tiles = () => [...hud.tiles.values()].map((t) => {
  const r = t.el.getBoundingClientRect(); // what is actually on screen, not the computed target
  return {
    label: t.entry.label, seat: t.entry.seat, kind: t.entry.kind, anchor: t.entry.anchor,
    name: t.subEl.textContent,
    // NaN here = the model has been rotated off into nowhere (bad quaternion input)
    finiteQuat: !t.overlay || !t.overlay.bodyGroup || Number.isFinite(t.overlay.bodyGroup.quaternion.w),
    rect: { left: r.left, top: r.top, width: r.width, height: r.height },
    profile: t.profile, hasModel: !!(t.overlay && t.overlay.model), creating: t._creating,
  };
});
window.__settle = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
window.__obstacles = () => [...document.querySelectorAll('.front-view-frame, #partner-pip-wrap, #pedal-bar, .versus-pedals')]
  .filter((el) => getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().width > 0 && el.offsetParent !== null)
  .map((el) => { const r = el.getBoundingClientRect(); return { id: el.id || el.className, left: r.left, top: r.top, right: r.right, bottom: r.bottom }; });

document.querySelectorAll('[data-scenario]').forEach((b) => b.addEventListener('click', () => setScenario(b.dataset.scenario)));
document.querySelectorAll('[data-obstacle]').forEach((b) => b.addEventListener('click', () => window.__setObstacle(b.dataset.obstacle, !obstacles[b.dataset.obstacle])));
document.getElementById('toggle-hud').addEventListener('click', () => hud.toggle());
window.addEventListener('keydown', (e) => { if (e.code === 'KeyC') hud.toggle(); });
window.addEventListener('resize', layoutObstacles);
setScenario(scenario);

const status = document.getElementById('status');
function loop(t) {
  requestAnimationFrame(loop);
  animatePads(t);
  animateSteamGyro(t);
  hud.update(ctx);
  if (Math.floor(t / 250) !== Math.floor((t - 16) / 250)) {
    status.textContent = window.__tiles().map((x) => `${x.label} ${x.seat} ${x.kind} ${x.anchor} ${x.profile || '-'} model=${x.hasModel} ` +
      (x.rect ? `@${Math.round(x.rect.left)},${Math.round(x.rect.top)} ${x.rect.width}x${x.rect.height}` : '')).join('\n');
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
