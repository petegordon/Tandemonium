<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Tandemonium VR</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc3ea; overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
      #scene-container canvas { display: block; touch-action: none; }
      #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: #0b0d12; color: #fff; transition: opacity .5s; text-align: center; padding: 24px; }
      #splash h1 { margin: 0; font-size: 40px; letter-spacing: 1px; }
      #splash p { margin: 0; font-size: 15px; color: #8a93a6; max-width: 460px; line-height: 1.5; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #hud { position: fixed; top: 10px; left: 10px; z-index: 5; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.6);
        color: #cfe; font: 600 13px/1.45 ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; }
      #enter-vr { position: fixed; top: 10px; right: 10px; z-index: 6; font: 700 18px system-ui, sans-serif; padding: 12px 22px; border: 0; border-radius: 999px;
        background: #44ff66; color: #06140c; cursor: pointer; }
      #enter-vr[hidden] { display: none; }
      #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5; padding: 8px 14px; border-radius: 10px;
        background: rgba(0,0,0,.55); color: #fff; font-size: 14px; pointer-events: none; text-align: center; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="splash"><h1>TANDEMONIUM VR</h1><p>Loading Grandma's road&hellip;</p></div>
    <div id="hud"></div>
    <button id="enter-vr" type="button" hidden>Enter VR</button>
    <div id="help">A / D or &larr; / &rarr; to lean &middot; Enter VR, then hold the handlebars and tilt them to steer</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
